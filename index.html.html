<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ExcelHire Customer 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1EE; --card:#FFFFFF; --ink:#1C2420; --ink-soft:#5B6B62;
    --line:#DADFDA; --line-soft:#E6EAE6;
    --teal:#1F6F54; --teal-soft:#E4F0EA;
    --amber:#B8722A; --amber-soft:#F7EBDD;
    --red:#A63A32; --red-soft:#F6E4E2;
    --blue:#3B5BA5; --blue-soft:#E7ECF6;
    --grey-soft:#EDEEEC;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif; font-size:14px; line-height:1.5; }
  h1,h2,h3,.serif{ font-family:'Source Serif 4', Georgia, serif; font-weight:600; letter-spacing:-0.01em; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:14px; }

  #app{ display:flex; min-height:100vh; }

  .sidebar{ width:220px; flex-shrink:0; background:#1C2420; color:#DCE3DD; padding:22px 16px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .brand{ font-family:'Source Serif 4', Georgia, serif; font-size:19px; font-weight:600; color:#fff; margin-bottom:2px; }
  .brand-logo{ height:26px; width:auto; display:block; }
  .brand-sub{ font-size:11.5px; color:#8FA096; margin-bottom:22px; }
  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{ display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:7px; color:#B8C3BB; background:transparent; border:none; text-align:left; font-size:13.5px; font-weight:500; }
  .nav-item:hover{ background:#2A332C; color:#fff; }
  .nav-item.active{ background:#2F6F54; color:#fff; }
  .nav-count{ margin-left:auto; font-size:11px; color:#8FA096; background:#2A332C; padding:1px 7px; border-radius:20px; }
  .nav-item.active .nav-count{ background:rgba(255,255,255,.18); color:#fff; }
  .acting-as{ margin-top:18px; padding-top:16px; border-top:1px solid #2A332C; }
  .acting-as label{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:#748477; margin-bottom:6px; }
  .acting-as select{ width:100%; background:#2A332C; color:#fff; border:1px solid #3A453C; border-radius:6px; padding:7px 8px; font-size:13px; }
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--paper,#F5F6F3); }
  .login-card{ width:340px; background:#fff; border:1px solid var(--line,#E4E6E1); border-radius:12px; padding:28px 26px; box-shadow:0 2px 16px rgba(0,0,0,.06); }
  .login-tabs{ display:flex; gap:4px; background:#F0F1EC; border-radius:8px; padding:3px; margin-bottom:18px; }
  .login-tab{ flex:1; border:none; background:transparent; padding:8px 0; font-size:13px; font-weight:600; color:var(--ink-soft,#748477); border-radius:6px; cursor:pointer; }
  .login-tab.active{ background:#fff; color:var(--ink,#1B1F1B); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .signed-in-as{ margin-top:18px; padding-top:16px; border-top:1px solid #2A332C; }
  .signed-in-as .who{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:#748477; margin-bottom:4px; }
  .signed-in-as .name{ font-size:13.5px; color:#fff; font-weight:600; margin-bottom:8px; }
  .signed-in-as button{ width:100%; background:#2A332C; color:#fff; border:1px solid #3A453C; border-radius:6px; padding:7px 8px; font-size:12.5px; cursor:pointer; }
  .signed-in-as button:hover{ background:#3A453C; }
  .sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid #2A332C; font-size:11.5px; color:#748477; }

  .main{ flex:1; min-width:0; padding:30px 38px 60px; }
  .topbar{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
  .page-title{ font-size:23px; margin:0; }
  .page-sub{ color:var(--ink-soft); font-size:13px; margin-top:3px; }

  .btn{ border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:7px; font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover{ border-color:#B9C2BC; }
  .btn-primary{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .btn-primary:hover{ background:#195C46; }
  .btn-danger{ color:var(--red); }
  .btn-ghost{ border-color:transparent; background:transparent; padding:6px 8px; }
  .btn-sm{ padding:5px 10px; font-size:12.5px; }

  .period-group{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .period-btn{ background:var(--card); border:none; border-right:1px solid var(--line); padding:7px 12px; font-size:12.5px; font-weight:500; color:var(--ink-soft); }
  .period-btn:last-child{ border-right:none; }
  .period-btn.active{ background:var(--teal); color:#fff; }

  .hero{ background:var(--card); border:1px solid var(--line-soft); border-radius:14px; padding:26px 30px; margin-bottom:20px; display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:24px; }
  .hero-figure .hero-label{ font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .hero-figure .hero-num{ font-size:42px; font-family:'Source Serif 4',serif; font-weight:600; }
  .hero-figure .hero-num small{ font-size:16px; color:var(--ink-soft); font-weight:500; margin-left:4px;}
  .hero-side{ display:flex; gap:26px; flex-wrap:wrap; }
  .hero-mini{ background:none; border:none; padding:0; text-align:left; }
  button.hero-mini{ cursor:pointer; }
  button.hero-mini:hover .hero-mini-num{ text-decoration:underline; }
  .hero-mini .hero-mini-label{ font-size:11.5px; color:var(--ink-soft); }
  .hero-mini .hero-mini-num{ font-size:19px; font-weight:600; font-family:'Source Serif 4',serif; }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px; }
  .stat-card{ background:var(--card); border:1px solid var(--line-soft); border-radius:10px; padding:14px 16px; width:100%; text-align:left; }
  button.stat-card{ cursor:pointer; transition:border-color .12s ease, transform .12s ease; }
  button.stat-card:hover{ border-color:#B9C2BC; transform:translateY(-1px); }
  .stat-card .stat-label{ font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .stat-card .stat-num{ font-size:22px; font-weight:600; font-family:'Source Serif 4',serif; }
  .stat-card.warn .stat-num{ color:var(--amber); }
  .stat-card.crit .stat-num{ color:var(--red); }
  .stat-card.good .stat-num{ color:var(--teal); }

  .panel-row{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start; }
  @media (max-width:980px){ .panel-row{ grid-template-columns:1fr; } }
  .panel{ background:var(--card); border:1px solid var(--line-soft); border-radius:12px; padding:18px 20px; margin-bottom:16px; }
  .revenue-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .rev-stat{ background:var(--paper); border:1px solid var(--line-soft); border-radius:10px; padding:10px 12px; }
  .rev-label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; }
  .rev-num{ font-family:'Source Serif 4', Georgia, serif; font-size:19px; font-weight:600; }
  .panel h3{ font-size:15.5px; margin:0 0 4px; }
  .panel .panel-sub{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }

  .attn-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft); cursor:pointer; }
  .attn-row:last-child{ border-bottom:none; }
  .attn-name{ font-weight:600; font-size:13.5px; }
  .attn-why{ font-size:12px; color:var(--ink-soft); }

  .bar-row{ display:flex; align-items:center; gap:10px; padding:6px 0; }
  .bar-label{ width:150px; font-size:12.5px; color:var(--ink-soft); flex-shrink:0; }
  .bar-track{ flex:1; background:var(--grey-soft); border-radius:5px; height:9px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--blue); border-radius:5px; }
  .bar-num{ width:30px; text-align:right; font-size:12.5px; font-weight:600; }
  .clickable-bar{ cursor:pointer; border-radius:6px; margin:0 -8px; padding:6px 8px; }
  .clickable-bar:hover{ background:#F5F7F5; }
  .expand-panel{ margin-top:6px; padding:8px 10px; background:#FAFBF9; border-radius:8px; }
  .expand-row{ display:flex; justify-content:space-between; gap:8px; padding:5px 0; font-size:12.5px; cursor:pointer; }
  .expand-row:hover{ text-decoration:underline; }

  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
  .empty .serif{ font-size:17px; color:var(--ink); margin-bottom:6px; }

  .pill{ display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .pill-Trial{ background:var(--blue-soft); color:var(--blue); }
  .pill-Active,.pill-Healthy,.pill-New,.pill-Completed,.pill-Resolved,.pill-Closed{ background:var(--teal-soft); color:var(--teal); }
  .pill-AtRisk,.pill-Downgrade{ background:var(--amber-soft); color:var(--amber); }
  .pill-Critical,.pill-Churned{ background:var(--red-soft); color:var(--red); }
  .pill-Dormant{ background:var(--grey-soft); color:var(--ink-soft); }
  .pill-Low,.pill-ToDo{ background:var(--grey-soft); color:var(--ink-soft); }
  .pill-Medium,.pill-Expansion{ background:var(--blue-soft); color:var(--blue); }
  .pill-High{ background:var(--amber-soft); color:var(--amber); }
  .pill-Open,.pill-InProgress{ background:var(--amber-soft); color:var(--amber); }

  .list-toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .search{ flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--line); border-radius:7px; background:var(--card); }
  .select{ padding:9px 10px; border:1px solid var(--line); border-radius:7px; background:var(--card); }
  .filter-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--teal-soft); color:var(--teal); padding:5px 10px; border-radius:20px; font-size:12.5px; font-weight:600; }
  .filter-chip button{ background:none; border:none; color:var(--teal); font-weight:700; padding:0; line-height:1; }

  table{ width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line-soft); border-radius:12px; overflow:hidden; }
  thead th{ text-align:left; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:11px 14px; border-bottom:1px solid var(--line-soft); background:#FAFAF8; }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--line-soft); font-size:13.5px; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:#FAFBF9; }
  .cell-name{ font-weight:600; }
  .cell-sub{ font-size:12px; color:var(--ink-soft); }

  .detail-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .detail-name{ font-size:24px; margin:0 0 6px; }
  .detail-meta{ display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft); align-items:center; }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; flex-wrap:wrap; }
  .tab{ padding:9px 4px; margin-right:18px; background:none; border:none; font-size:13.5px; font-weight:500; color:var(--ink-soft); border-bottom:2px solid transparent; }
  .tab.active{ color:var(--ink); border-bottom-color:var(--teal); font-weight:600; }

  .field-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
  .login-card .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  .field .readonly{ padding:8px 10px; background:#FAFBF9; border:1px solid var(--line-soft); border-radius:6px; font-weight:600; }

  .timeline{ list-style:none; margin:0; padding:0; }
  .timeline li{ display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line-soft); }
  .timeline li:last-child{ border-bottom:none; }
  .tl-date{ width:82px; flex-shrink:0; font-size:11.5px; color:var(--ink-soft); padding-top:2px; }
  .tl-body{ flex:1; }
  .tl-type{ font-size:11.5px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px; }
  .tl-text{ font-size:13.5px; }

  .add-form{ background:#FAFBF9; border:1px solid var(--line-soft); border-radius:10px; padding:14px 16px; margin-bottom:18px; }
  .add-form-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .add-form-row input, .add-form-row select, .add-form-row textarea{ padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .add-form textarea{ width:100%; min-height:56px; resize:vertical; }

  .ticket-card,.task-card{ border:1px solid var(--line-soft); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .ticket-top,.task-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .ticket-title,.task-title{ font-weight:600; font-size:13.5px; }
  .ticket-meta,.task-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .ticket-pills,.task-pills{ display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
  .task-controls{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .task-controls select, .task-controls input{ padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; font-size:12.5px; }
  .task-history{ margin-top:8px; font-size:11.5px; color:var(--ink-soft); }
  .task-history-toggle{ background:none; border:none; color:var(--blue); font-size:11.5px; font-weight:600; padding:0; margin-top:8px; }

  .owner-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--grey-soft); padding:4px 10px 4px 4px; border-radius:20px; font-size:12.5px; margin:0 6px 6px 0; }
  .owner-avatar{ width:20px; height:20px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; }
  .owner-chip button{ background:none; border:none; color:var(--ink-soft); font-weight:700; padding:0 0 0 4px; }

  .team-card{ background:var(--card); border:1px solid var(--line-soft); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .team-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .team-card-name{ font-size:15px; font-weight:600; }
  .team-card-stats{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:10px; }
  .team-mini{ font-size:11.5px; color:var(--ink-soft); }
  .team-mini b{ display:block; font-size:16px; color:var(--ink); font-family:'Source Serif 4',serif; }
  .team-task-row{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--line-soft); font-size:12.5px; cursor:pointer; }
  .team-task-row:hover{ text-decoration:underline; }

  .audit-row{ display:flex; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13px; }
  .audit-row:last-child{ border-bottom:none; }
  .audit-when{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; }
  .audit-link{ color:var(--blue); cursor:pointer; font-weight:600; }
  .audit-link:hover{ text-decoration:underline; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,26,22,.42); display:flex; align-items:flex-start; justify-content:center; padding:44px 16px; z-index:50; overflow:auto; }
  .modal{ background:var(--card); border-radius:14px; padding:26px 28px; width:100%; max-width:560px; }
  .modal h3{ margin:0 0 16px; font-size:18px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }

  .toast{ position:fixed; bottom:22px; right:22px; background:#1C2420; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transform:translateY(6px); transition:opacity .2s ease, transform .2s ease; pointer-events:none; z-index:80; }
  .toast.show{ opacity:1; transform:translateY(0); }
</style>
</head>
<body>
<div id="app"></div>

<script>
const STATUS_OPTIONS = ['Trial','Active','At Risk','Critical','Dormant','Churned'];
const BILLING_CYCLES = { 'Monthly':1, 'Quarterly':3, 'Half-Yearly':6, 'Yearly':12 };
const NOTE_TYPES = ['Call','Email','Demo','Support','Renewal Discussion','Payment Discussion','Feature Request','Onboarding','Other'];
const MODULES = ['ATS','AI Sourcing','AI Resume Matching','AI Voice','AI Video Interview','Job Posting','Job Boards','VMS Integration','Candidate Management','Mass Email','LinkedIn Integration','Bench Sales','HRMS','Onboarding','Timesheets','Reporting & Analytics','Billing & Subscription','API / Integrations','Login / Authentication','Other'];
const FEATURES = ['ATS / Job Creation','AI Sourcing','AI Resume Matching','AI Voice Calling','AI Video Interview','Job Boards (LinkedIn/Dice/Monster/Indeed)','VMS Integration','Candidate Pipeline','Mass Email','LinkedIn Integration','Bench Sales','HRMS / Onboarding','Timesheets','Reporting & Analytics','API / Integrations','Other'];
const PRIORITIES = ['Low','Medium','High','Critical'];
const TICKET_STATUSES = ['Open','In Progress','Resolved','Closed'];
const TASK_TYPES = ['Call','Meeting','Deliverable','Note/Comment','Next Step','Issue/Blocker','Other'];

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const dt = new Date(iso);
  if(isNaN(dt)) return iso;
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function daysUntil(d){
  if(!d) return null;
  const dt = new Date(d+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((dt-now)/86400000);
}
function daysSince(d){ if(!d) return null; return -daysUntil(d); }
function money(n){ n = Number(n)||0; return '$'+n.toLocaleString('en-US',{maximumFractionDigits:0}); }
function pillClass(v){ return 'pill pill-'+String(v).replace(/\s+/g,''); }
function fmtMinutes(m){
  m = Number(m)||0;
  const h = Math.floor(m/60), mm = m%60;
  if(h===0) return mm+'m';
  return h+'h '+(mm?mm+'m':'');
}
function periodDays(key){ return (PERIODS.find(p=>p.key===key)||PERIODS[2]).days; }
function inPeriod(dateStr, key){
  if(!dateStr) return false;
  const ds = daysSince(dateStr);
  return ds!==null && ds>=0 && ds < periodDays(key);
}
function inPeriodOrRange(dateStr, key, from, to){
  if(!dateStr) return false;
  if(key==='custom'){
    if(!from && !to) return false;
    if(from && dateStr < from) return false;
    if(to && dateStr > to) return false;
    return true;
  }
  return inPeriod(dateStr, key);
}
function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}

/* ---------- Persistence: syncs one customer's full subtree (customer row + all children) ----------
   Uses upsert (never delete-then-reinsert) so a save can never race with the 5s live-refresh poll
   or with another in-flight save and wipe rows that are mid-flight. Nothing in this UI removes a
   single task/ticket/note/etc independently of removing the whole customer, so upsert-only is safe. */
let pendingSaveCount = 0;
const saveQueues = {}; // customer id -> promise chain, so two saves for the same customer never overlap
async function persistCustomer(c){
  const prior = saveQueues[c.id] || Promise.resolve();
  const run = prior.then(()=>doPersistCustomer(c)).catch(()=>{});
  saveQueues[c.id] = run;
  return run;
}
async function doPersistCustomer(c){
  pendingSaveCount++;
  try{
    await sbUpsert('customers', [customerToRow(c)]);
    const tasks = c.tasks||[];
    if(tasks.length) await sbUpsert('tasks', tasks.map(t=>taskToRow(t,c.id)));
    const histRows = [];
    tasks.forEach(t=> (t.history||[]).forEach(h=> histRows.push(historyToRow(h, t.id))));
    if(histRows.length) await sbUpsert('task_history', histRows);
    if((c.tickets||[]).length) await sbUpsert('tickets', c.tickets.map(t=>ticketToRow(t,c.id)));
    if((c.notes||[]).length) await sbUpsert('notes', c.notes.map(n=>noteToRow(n,c.id)));
    if((c.featureUsage||[]).length) await sbUpsert('feature_usage', c.featureUsage.map(f=>featureToRow(f,c.id)));
    if((c.mrrEvents||[]).length) await sbUpsert('mrr_events', c.mrrEvents.map(m=>mrrEventToRow(m,c.id)));
    if((c.subscriptionCycles||[]).length) await sbUpsert('subscription_cycles', c.subscriptionCycles.map(s=>subCycleToRow(s,c.id)));
    if((c.payments||[]).length) await sbUpsert('payments', c.payments.map(p=>paymentToRow(p,c.id)));
    if((c.addons||[]).length) await sbUpsert('addons', c.addons.map(a=>addonToRow(a,c.id)));
  }catch(e){ console.error(e); showToast('Save failed — changes may not have synced.'); }
  finally{ pendingSaveCount--; }
}

// Refetches data quietly, without disturbing whatever the person is doing (typing, an open form).
async function silentRefresh(){
  if(document.hidden) return;
  const ae = document.activeElement;
  if(ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)) return;
  if(pendingSaveCount>0) return; // a save is still in flight — refreshing now would overwrite it with stale server data
  const ok = await ensureFreshSession();
  if(!ok) return;
  if(pendingSaveCount>0) return; // re-check: a save may have started while we were refreshing the session
  await loadAll();
}
let liveSyncInterval = null;
function startLiveSync(){
  if(liveSyncInterval) return; // already running — don't stack a second poller
  liveSyncInterval = setInterval(silentRefresh, 5000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) silentRefresh(); });
  window.addEventListener('focus', silentRefresh);
}
function stopLiveSync(){
  if(liveSyncInterval){ clearInterval(liveSyncInterval); liveSyncInterval = null; }
}

  if(!t){ t = document.createElement('div'); t.className='toast'; document.body.appendChild(t); }

/* ---------- Routing: every customer gets a real address, so it can be opened in its own tab ---------- */
function customerUrl(id, tab){
  const base = location.href.split('#')[0];
  return base + '#/customer/' + id + (tab ? '/' + encodeURIComponent(tab) : '');
}
function parseCustomerHash(hash){
  const m = (hash||'').match(/^#\/customer\/([^\/]+)(?:\/(.+))?$/);
  if(!m) return null;
  return { id: decodeURIComponent(m[1]), tab: m[2] ? decodeURIComponent(m[2]) : null };
}
let initialRouteApplied = false;
function applyInitialRoute(){
  if(initialRouteApplied) return;
  initialRouteApplied = true;
  const r = parseCustomerHash(location.hash);
  if(r && getCustomer(r.id)){ state.view='detail'; state.activeId=r.id; if(r.tab) state.detailTab=r.tab; }
}
window.addEventListener('hashchange', ()=>{
  const r = parseCustomerHash(location.hash);
  if(r && getCustomer(r.id)){ state.view='detail'; state.activeId=r.id; if(r.tab) state.detailTab=r.tab; render(); }
});

function goToCustomer(id, tab){
  const url = customerUrl(id, tab);
  let win = null;
  try{ win = window.open(url, '_blank'); }catch(e){ win = null; }
  if(!win){
    // Popup blocked (or running somewhere that doesn't allow new tabs) — fall back to opening it right here.
    location.hash = '/customer/' + id + (tab ? '/' + encodeURIComponent(tab) : '');
    state.view='detail'; state.activeId=id; state.detailTab=tab||'overview'; render();
    showToast('New tab was blocked by the browser — opened here instead.');
  }
}

/* ---------- MRR logic ---------- */
function computeMrrFor(c){
  if(c.status==='Churned') return 0;
  const months = BILLING_CYCLES[c.billingCycle] || 1;
  return Math.round((Number(c.dealValue)||0) / months);
}
function recalcMrr(c){
  const oldMrr = Number(c.mrr)||0;
  const newMrr = computeMrrFor(c);
  if(newMrr !== oldMrr){
    let type, amount = newMrr - oldMrr;
    if(c.status==='Churned' && oldMrr>0){ type='Churned'; amount = -oldMrr; }
    else if(oldMrr===0 && newMrr>0){ type='New'; amount = newMrr; }
    else if(newMrr>oldMrr){ type='Expansion'; }
    else { type='Downgrade'; }
    c.mrrEvents = c.mrrEvents || [];
    c.mrrEvents.unshift({ id:uid(), date: todayISO(), type, amount, note: c.billingCycle+' · deal value '+money(c.dealValue) });
    logAudit(`${type} MRR ${amount>=0?'+':''}${money(amount)} for ${c.name}`, c.id, c.name, 'overview');
  }
  c.mrr = newMrr;
}

function computeStats(){
  const cs = state.customers;
  const active = cs.filter(c=>c.status!=='Churned');
  const mrr = active.reduce((s,c)=>s+(Number(c.mrr)||0),0);
  const arr = mrr*12;
  const byStatus = {}; STATUS_OPTIONS.forEach(s=>byStatus[s]=0);
  cs.forEach(c=>{ byStatus[c.status] = (byStatus[c.status]||0)+1; });

  const allTickets = [];
  cs.forEach(c=> (c.tickets||[]).forEach(t=> allTickets.push({...t, customer:c.name, customerId:c.id})));
  const openTickets = allTickets.filter(t=>t.status==='Open'||t.status==='In Progress');
  const criticalTickets = openTickets.filter(t=>t.priority==='Critical');

  const renewals = cs.filter(c=>c.renewalDate).map(c=>({...c, d:daysUntil(c.renewalDate)}));
  const r30 = renewals.filter(c=>c.d!==null && c.d>=0 && c.d<=30);
  const r60 = renewals.filter(c=>c.d!==null && c.d>30 && c.d<=60);
  const r90 = renewals.filter(c=>c.d!==null && c.d>60 && c.d<=90);

  const moduleCounts = {}, moduleTickets = {};
  allTickets.forEach(t=>{ moduleCounts[t.module] = (moduleCounts[t.module]||0)+1; (moduleTickets[t.module]=moduleTickets[t.module]||[]).push(t); });
  const topModules = Object.entries(moduleCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const allTasks = [];
  cs.forEach(c=> (c.tasks||[]).forEach(t=> allTasks.push({...t, customer:c.name, customerId:c.id})));
  const openTasks = allTasks.filter(t=>t.status!=='Completed');

  // Owner-wise revenue managed vs work performed
  const ownerMrr = {};
  active.forEach(c=>{ const o=c.owner||'Unassigned'; ownerMrr[o]=(ownerMrr[o]||0)+(Number(c.mrr)||0); });
  const ownerCustCount = {};
  cs.forEach(c=>{ const o=c.owner||'Unassigned'; ownerCustCount[o]=(ownerCustCount[o]||0)+1; });
  const ownerTaskCompleted = {}, ownerTaskOpen = {};
  allTasks.forEach(t=>{ const o=t.owner||'Unassigned'; if(t.status==='Completed') ownerTaskCompleted[o]=(ownerTaskCompleted[o]||0)+1; else ownerTaskOpen[o]=(ownerTaskOpen[o]||0)+1; });
  const ownerNames = Array.from(new Set([...state.owners, ...Object.keys(ownerMrr), ...Object.keys(ownerCustCount)])).filter(o=>o);
  const ownerReport = ownerNames.map(o=>({ owner:o, mrr: ownerMrr[o]||0, customers: ownerCustCount[o]||0, completed: ownerTaskCompleted[o]||0, open: ownerTaskOpen[o]||0 })).sort((a,b)=>b.mrr-a.mrr);
  const maxOwnerMrr = ownerReport.length? Math.max(...ownerReport.map(o=>o.mrr),1) : 1;

  const attention = [];
  cs.forEach(c=>{
    const openCrit = (c.tickets||[]).filter(t=>(t.status==='Open'||t.status==='In Progress') && (t.priority==='Critical'||t.priority==='High'));
    const sinceContact = c.lastContact ? daysSince(c.lastContact) : null;
    if(c.status==='Critical') attention.push({c, why:'Marked Critical health', weight:5});
    else if(openCrit.length) attention.push({c, why: openCrit.length+' open '+(openCrit.length>1?'issues':'issue')+' — high/critical priority', weight:4});
    else if(c.renewalDate && daysUntil(c.renewalDate)!==null && daysUntil(c.renewalDate)>=0 && daysUntil(c.renewalDate)<=14) attention.push({c, why:'Renewal in '+daysUntil(c.renewalDate)+' days', weight:3});
    else if(sinceContact!==null && sinceContact>30 && c.status!=='Churned' && c.status!=='Dormant') attention.push({c, why:'No contact in '+sinceContact+' days', weight:2});
  });
  attention.sort((a,b)=>b.weight-a.weight);

  // MRR movement within reportPeriod
  const events = [];
  cs.forEach(c=> (c.mrrEvents||[]).forEach(ev=> events.push({...ev, customerId:c.id, customerName:c.name})));
  const inRangeEvents = events.filter(ev=>inPeriodOrRange(ev.date, state.reportPeriod, state.reportFrom, state.reportTo));
  const mrrMove = {New:0, Expansion:0, Downgrade:0, Churned:0};
  const mrrMoveEvents = {New:[], Expansion:[], Downgrade:[], Churned:[]};
  inRangeEvents.forEach(ev=>{ mrrMove[ev.type] = (mrrMove[ev.type]||0) + ev.amount; (mrrMoveEvents[ev.type]=mrrMoveEvents[ev.type]||[]).push(ev); });

  return { total:cs.length, byStatus, mrr, arr, openTickets, criticalTickets, r30, r60, r90, topModules, moduleTickets, attention, openTasks, mrrMove, mrrMoveEvents, maxModule: topModules.length? topModules[0][1] : 1, ownerReport, maxOwnerMrr };
}

/* ---------- Rendering ---------- */
function renderLogin(){
  const app = document.getElementById('app');
  let mode = 'signin'; // signin | signup | check-email
  const draw = ()=>{
    app.innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <img src="${LOGO_DARK_TEXT}" alt="ExcelHire" class="brand-logo" style="margin-bottom:6px;">
          <div class="brand-sub" style="margin-bottom:22px;">Customer 360</div>
          ${mode==='check-email' ? `
            <div style="font-size:14px;line-height:1.5;color:var(--ink-soft);">
              Almost there — we sent a confirmation link to <b>${escapeHtml(lastEmail)}</b>. Click it, then come back and sign in.
            </div>
            <button class="btn btn-primary" style="margin-top:16px;width:100%;" id="back-to-signin">Back to sign in</button>
          ` : `
            <div class="login-tabs">
              <button class="login-tab ${mode==='signin'?'active':''}" data-mode="signin">Sign in</button>
              <button class="login-tab ${mode==='signup'?'active':''}" data-mode="signup">Create account</button>
            </div>
            <div class="field" style="${mode==='signup'?'':'display:none;'}"><label>Your name</label><input id="lg-name" type="text" placeholder="Jane Rao"></div>
            <div class="field"><label>Email</label><input id="lg-email" type="email" placeholder="you@company.com"></div>
            <div class="field"><label>Password</label><input id="lg-password" type="password" placeholder="••••••••"></div>
            <div id="lg-error" style="color:#C0392B;font-size:12.5px;min-height:16px;margin-bottom:6px;"></div>
            <button class="btn btn-primary" style="width:100%;" id="lg-submit">${mode==='signin'?'Sign in':'Create account'}</button>
          `}
        </div>
      </div>
    `;
    app.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click', ()=>{ mode=b.dataset.mode; draw(); }));
    const back = app.querySelector('#back-to-signin');
    if(back) back.addEventListener('click', ()=>{ mode='signin'; draw(); });
    const submit = app.querySelector('#lg-submit');
    if(submit) submit.addEventListener('click', async ()=>{
      const email = app.querySelector('#lg-email').value.trim();
      const password = app.querySelector('#lg-password').value;
      const errEl = app.querySelector('#lg-error');
      errEl.textContent = '';
      if(!email || !password){ errEl.textContent = 'Email and password are required.'; return; }
      submit.disabled = true; submit.textContent = 'Please wait…';
      try{
        if(mode==='signup'){
          const name = app.querySelector('#lg-name').value.trim();
          if(!name){ errEl.textContent = 'Please enter your name.'; submit.disabled=false; submit.textContent='Create account'; return; }
          const data = await authSignUp(email, password, name);
          lastEmail = email;
          if(data.access_token){
            await saveSession(data);
            state.actor = name;
            await loadAll();
            startLiveSync();
          } else {
            mode = 'check-email'; draw();
          }
        } else {
          const data = await authSignIn(email, password);
          await saveSession(data);
          const profile = await fetchMyProfile().catch(()=>null);
          state.actor = profile ? profile.name : email.split('@')[0];
          await loadAll();
          startLiveSync();
        }
      }catch(e){
        errEl.textContent = e.message || 'Something went wrong.';
        submit.disabled = false; submit.textContent = mode==='signin'?'Sign in':'Create account';
      }
    });
  };
  let lastEmail = '';
  draw();
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = '<div style="padding:60px;color:#5B6B62;">Loading…</div>'; return; }

  // Preserve whatever the user is typing in / where their cursor is, since the whole
  // tree below gets rebuilt on every keystroke. Without this the input loses focus
  // and the caret jumps to the end after every character.
  const active = document.activeElement;
  const isTypable = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT');
  const focusInfo = (isTypable && active.id) ? {
    id: active.id,
    selStart: (typeof active.selectionStart==='number') ? active.selectionStart : null,
    selEnd: (typeof active.selectionEnd==='number') ? active.selectionEnd : null,
    scrollY: window.scrollY,
  } : null;

  app.innerHTML = '';
  app.appendChild(renderSidebar());
  const main = document.createElement('div');
  main.className='main';
  if(state.view==='dashboard') main.appendChild(renderDashboard());
  else if(state.view==='list') main.appendChild(renderList());
  else if(state.view==='detail') main.appendChild(renderDetail());
  else if(state.view==='tickets') main.appendChild(renderTicketsView());
  else if(state.view==='team') main.appendChild(renderTeam());
  else if(state.view==='audit') main.appendChild(renderAudit());
  app.appendChild(main);
  if(state.showAddCustomer) app.appendChild(renderAddCustomerModal());

  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el){
      el.focus({preventScroll:true});
      if(focusInfo.selStart!=null && el.setSelectionRange){
        try{ el.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); }catch(e){}
      }
      window.scrollTo(0, focusInfo.scrollY);
    }
  }
}

function renderPeriodSelector(current, onSet, customOpts){
  const el = document.createElement('div');
  const group = document.createElement('div');
  group.className='period-group';
  PERIODS.forEach(p=>{
    const b = document.createElement('button');
    b.className='period-btn'+(current===p.key?' active':'');
    b.textContent = p.label;
    b.addEventListener('click', ()=>onSet(p.key));
    group.appendChild(b);
  });
  if(customOpts){
    const cb = document.createElement('button');
    cb.className='period-btn'+(current==='custom'?' active':'');
    cb.textContent = 'Custom';
    cb.addEventListener('click', ()=>onSet('custom'));
    group.appendChild(cb);
  }
  el.appendChild(group);
  if(customOpts && current==='custom'){
    const rangeWrap = document.createElement('div');
    rangeWrap.style.cssText = 'display:flex;gap:8px;align-items:center;margin-top:8px;';
    rangeWrap.innerHTML = `
      <input type="date" id="range-from" value="${customOpts.from||''}" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;">
      <span style="font-size:12.5px;color:var(--ink-soft);">to</span>
      <input type="date" id="range-to" value="${customOpts.to||''}" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;">
    `;
    rangeWrap.querySelector('#range-from').addEventListener('change', e=>customOpts.onFrom(e.target.value));
    rangeWrap.querySelector('#range-to').addEventListener('change', e=>customOpts.onTo(e.target.value));
    el.appendChild(rangeWrap);
  }
  return el;
}

function renderSidebar(){
  const s = computeStats();
  const el = document.createElement('div');
  el.className='sidebar';
  el.innerHTML = `
    <img src="${LOGO_LIGHT_TEXT}" alt="ExcelHire" class="brand-logo">
    <div class="brand-sub">Customer 360</div>
    <div class="nav">
      <button class="nav-item ${state.view==='dashboard'?'active':''}" data-nav="dashboard">Overview</button>
      <button class="nav-item ${state.view==='list'||state.view==='detail'?'active':''}" data-nav="list">Customers <span class="nav-count">${s.total}</span></button>
      <button class="nav-item ${state.view==='tickets'?'active':''}" data-nav="tickets">Tickets <span class="nav-count">${s.openTickets.length}</span></button>
      <button class="nav-item ${state.view==='team'?'active':''}" data-nav="team">Team activity <span class="nav-count">${s.openTasks.length}</span></button>
      <button class="nav-item ${state.view==='audit'?'active':''}" data-nav="audit">Activity log</button>
    </div>
    <div class="signed-in-as">
      <div class="who">Signed in as</div>
      <div class="name">${escapeHtml(state.actor||'')}</div>
      <button id="sign-out-btn">Sign out</button>
    </div>
    <div class="sidebar-foot">${s.total} customer${s.total===1?'':'s'} tracked<br>${s.openTickets.length} open issue${s.openTickets.length===1?'':'s'} · ${s.openTasks.length} open task${s.openTasks.length===1?'':'s'}</div>
  `;
  el.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=>{ state.view = b.dataset.nav; state.activeId=null; render(); }));
  el.querySelector('#sign-out-btn').addEventListener('click', async ()=>{
    stopLiveSync();
    await authSignOut();
    await clearSession();
    state.customers = []; state.owners = []; state.actor = ''; state.auditLog = []; state.loaded = false;
    renderLogin();
  });
  return el;
}

function renderDashboard(){
  const s = computeStats();
  const wrap = document.createElement('div');

  if(s.total===0){
    wrap.innerHTML = `
      <div class="topbar"><div><h1 class="page-title">Overview</h1><div class="page-sub">What's happening across your book of customers.</div></div></div>
      <div class="panel empty">
        <div class="serif">No customers yet</div>
        <div style="margin-bottom:16px;">Add your first customer to start building the picture.</div>
        <button class="btn btn-primary" id="empty-add">+ Add customer</button>
      </div>`;
    wrap.querySelector('#empty-add').addEventListener('click', ()=>{ state.showAddCustomer=true; render(); });
    return wrap;
  }

  const attnRows = s.attention.slice(0,8).map(a=>`
    <div class="attn-row" data-open="${a.c.id}">
      <div><div class="attn-name">${escapeHtml(a.c.name)}</div><div class="attn-why">${escapeHtml(a.why)}</div></div>
      <span class="${pillClass(a.c.status)}">${a.c.status}</span>
    </div>`).join('') || '<div class="empty" style="padding:20px;">Nothing needs attention right now.</div>';

  const moduleRows = s.topModules.map(([m,count])=>{
    const expanded = state.expandedModule===m;
    const tickets = (s.moduleTickets[m]||[]).slice(0,8);
    return `
    <div class="bar-row clickable-bar" data-module="${escapeAttr(m)}">
      <div class="bar-label">${escapeHtml(m)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/s.maxModule*100)}%"></div></div>
      <div class="bar-num">${count}</div>
    </div>
    ${expanded ? `<div class="expand-panel">${tickets.map(t=>`
      <div class="expand-row" data-open="${t.customerId}"><span>${escapeHtml(t.customer)} — ${escapeHtml(t.title)}</span><span class="${pillClass(t.status)}">${t.status}</span></div>`).join('') || '<div style="font-size:12.5px;color:var(--ink-soft);">No tickets.</div>'}</div>` : ''}
    `;}).join('') || '<div class="empty" style="padding:20px;">No support issues logged yet.</div>';

  const mrrTypes = [['New','good'],['Expansion',''],['Downgrade','warn'],['Churned','crit']];
  const mrrCards = mrrTypes.map(([type,cls])=>{
    const val = s.mrrMove[type]||0;
    const expanded = state.expandedMrr===type;
    const evs = (s.mrrMoveEvents[type]||[]).slice(0,8);
    return `
    <button class="stat-card ${cls}" data-mrr="${type}">
      <div class="stat-label">${type} MRR</div>
      <div class="stat-num">${val>=0&&type!=='Downgrade'&&type!=='Churned'?'+':''}${money(val)}</div>
    </button>
    ${expanded ? `<div class="expand-panel" style="grid-column:1/-1;">${evs.map(ev=>`
      <div class="expand-row" data-open="${ev.customerId}"><span>${escapeHtml(ev.customerName)} — ${fmtDate(ev.date)}</span><span>${money(ev.amount)}</span></div>`).join('') || '<div style="font-size:12.5px;color:var(--ink-soft);">No events in this period.</div>'}</div>` : ''}
    `;
  }).join('');

  wrap.innerHTML = `
    <div class="topbar">
      <div><h1 class="page-title">Overview</h1><div class="page-sub">What's happening across your book of customers — click any number to dig in.</div></div>
      <button class="btn btn-primary" id="dash-add">+ Add customer</button>
    </div>

    <div class="hero">
      <div class="hero-figure"><div class="hero-label">Annual recurring revenue</div><div class="hero-num">${money(s.arr)} <small>ARR</small></div></div>
      <div class="hero-side">
        <div class="hero-mini"><div class="hero-mini-label">MRR</div><div class="hero-mini-num">${money(s.mrr)}</div></div>
        <button class="hero-mini" data-status-group="active"><div class="hero-mini-label">Active accounts</div><div class="hero-mini-num">${s.total - s.byStatus['Churned']}</div></button>
        <button class="hero-mini" data-renewal="90"><div class="hero-mini-label">Renewals ≤ 90d</div><div class="hero-mini-num">${s.r30.length+s.r60.length+s.r90.length}</div></button>
        <button class="hero-mini" data-nav-tasks="1"><div class="hero-mini-label">Open tasks</div><div class="hero-mini-num">${s.openTasks.length}</div></button>
      </div>
    </div>

    <div class="stat-grid">
      <button class="stat-card" data-status="Trial"><div class="stat-label">Trial</div><div class="stat-num">${s.byStatus['Trial']}</div></button>
      <button class="stat-card good" data-status="Active"><div class="stat-label">Active</div><div class="stat-num">${s.byStatus['Active']}</div></button>
      <button class="stat-card warn" data-status="At Risk"><div class="stat-label">At risk</div><div class="stat-num">${s.byStatus['At Risk']}</div></button>
      <button class="stat-card crit" data-status="Critical"><div class="stat-label">Critical</div><div class="stat-num">${s.byStatus['Critical']}</div></button>
      <button class="stat-card" data-status="Dormant"><div class="stat-label">Dormant</div><div class="stat-num">${s.byStatus['Dormant']}</div></button>
      <button class="stat-card" data-status="Churned"><div class="stat-label">Churned</div><div class="stat-num">${s.byStatus['Churned']}</div></button>
    </div>

    <div class="panel">
      <div class="team-card-head">
        <div><h3 style="margin-bottom:2px;">MRR movement</h3><div class="panel-sub" style="margin-bottom:0;">New, expansion, downgrade &amp; churn — click a card for the customers behind it</div></div>
        <div id="mrr-period"></div>
      </div>
      <div class="stat-grid" style="margin-bottom:0;">${mrrCards}</div>
    </div>

    <div class="panel-row">
      <div class="panel">
        <h3>Needs attention today</h3>
        <div class="panel-sub">Critical health, high/critical open issues, upcoming renewals, or stale contact.</div>
        ${attnRows}
      </div>
      <div>
        <div class="panel">
          <h3>Support issues</h3>
          <div class="panel-sub">${s.openTickets.length} open (${s.criticalTickets.length} critical) · click a module</div>
          ${moduleRows}
        </div>
      </div>
    </div>

    <div class="panel" id="renewal-analytics">
      <div class="team-card-head">
        <div><h3 style="margin-bottom:2px;">Renewal analytics</h3><div class="panel-sub" style="margin-bottom:0;">Every upcoming (and overdue) renewal, with company names, MRR at stake and who owns it.</div></div>
      </div>
      <div class="list-toolbar" style="margin-bottom:12px;">
        <input class="search" id="ra-search" placeholder="Search company…" value="${escapeAttr(state.raSearch)}" style="max-width:220px;">
        <select class="select" id="ra-window">
          <option value="30" ${state.raWindow==='30'?'selected':''}>Next 30 days</option>
          <option value="60" ${state.raWindow==='60'?'selected':''}>Next 60 days</option>
          <option value="90" ${state.raWindow==='90'?'selected':''}>Next 90 days</option>
          <option value="180" ${state.raWindow==='180'?'selected':''}>Next 180 days</option>
          <option value="overdue" ${state.raWindow==='overdue'?'selected':''}>Overdue only</option>
          <option value="all" ${state.raWindow==='all'?'selected':''}>All with a renewal date</option>
        </select>
        <select class="select" id="ra-owner">
          <option value="All" ${state.raOwner==='All'?'selected':''}>All owners</option>
          ${(state.customers.some(c=>!c.owner)?['Unassigned',...state.owners]:state.owners).map(o=>{ const v=o==='Unassigned'?'':o; return `<option value="${escapeAttr(v)}" ${state.raOwner===v?'selected':''}>${o}</option>`; }).join('')}
        </select>
        <select class="select" id="ra-status">
          <option ${state.raStatus==='All'?'selected':''}>All</option>
          ${STATUS_OPTIONS.map(o=>`<option ${state.raStatus===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>
      ${(()=>{
        const q = state.raSearch.trim().toLowerCase();
        let rows = state.customers.filter(c=>c.renewalDate).map(c=>({c, d:daysUntil(c.renewalDate)})).filter(r=>r.d!==null);
        if(state.raWindow==='overdue') rows = rows.filter(r=>r.d<0);
        else if(state.raWindow!=='all') rows = rows.filter(r=>r.d>=0 && r.d<=Number(state.raWindow));
        if(state.raOwner!=='All') rows = rows.filter(r=>(r.c.owner||'')===state.raOwner);
        if(state.raStatus!=='All') rows = rows.filter(r=>r.c.status===state.raStatus);
        if(q) rows = rows.filter(r=>r.c.name.toLowerCase().includes(q));
        rows.sort((a,b)=>a.d-b.d);
        const mrrAtStake = rows.reduce((s2,r)=>s2+(Number(r.c.mrr)||0),0);
        if(rows.length===0) return `<div class="empty" style="padding:20px;">No renewals match these filters.</div>`;
        return `
        <div class="page-sub" style="margin:-4px 0 10px;">${rows.length} customer${rows.length===1?'':'s'} · ${money(mrrAtStake)} MRR at stake</div>
        <table>
          <thead><tr><th>Company</th><th>Status</th><th>Account manager</th><th>Owner</th><th>MRR</th><th>Renewal date</th><th>Days</th></tr></thead>
          <tbody>
            ${rows.map(r=>{
              const c=r.c, d=r.d;
              const dLabel = d<0 ? `${-d}d overdue` : (d===0?'Today':`in ${d}d`);
              const dClass = d<0 ? 'crit' : (d<=30?'warn':'good');
              return `<tr data-open="${c.id}">
                <td><div class="cell-name">${escapeHtml(c.name)}</div></td>
                <td><span class="${pillClass(c.status)}">${c.status}</span></td>
                <td>${escapeHtml(c.accountManager||'—')}</td>
                <td>${escapeHtml(c.owner||'—')}</td>
                <td>${money(c.mrr)}</td>
                <td>${fmtDate(c.renewalDate)}</td>
                <td><span class="stat-num ${dClass}" style="font-size:13px;">${dLabel}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`;
      })()}
    </div>

    <div class="panel">
      <h3 style="margin-bottom:2px;">Revenue vs. work performed — by owner</h3>
      <div class="panel-sub">MRR managed, accounts owned, and task throughput per teammate. Click a name to see their book.</div>
      ${s.ownerReport.length===0 ? `<div class="empty" style="padding:20px;">No owners assigned yet.</div>` :
        `<table><thead><tr><th>Owner</th><th>MRR managed</th><th>Accounts</th><th>Tasks completed</th><th>Tasks open</th></tr></thead><tbody>
          ${s.ownerReport.map(o=>`
            <tr data-owner-row="${escapeAttr(o.owner)}">
              <td class="cell-name">${escapeHtml(o.owner)}</td>
              <td>${money(o.mrr)}</td>
              <td>${o.customers}</td>
              <td>${o.completed}</td>
              <td>${o.open}</td>
            </tr>`).join('')}
        </tbody></table>`}
    </div>
  `;
  wrap.querySelector('#mrr-period').appendChild(renderPeriodSelector(state.reportPeriod, key=>{ state.reportPeriod=key; render(); }, {
    from: state.reportFrom, to: state.reportTo,
    onFrom: v=>{ state.reportFrom=v; render(); },
    onTo: v=>{ state.reportTo=v; render(); },
  }));
  wrap.querySelector('#dash-add').addEventListener('click', ()=>{ state.showAddCustomer=true; render(); });
  wrap.querySelectorAll('[data-open]').forEach(r=>r.addEventListener('click', (e)=>{ e.stopPropagation(); goToCustomer(r.dataset.open); }));
  wrap.querySelectorAll('[data-status]').forEach(r=>r.addEventListener('click', ()=>{ state.view='list'; state.statusFilter=r.dataset.status; state.ownerFilter='All'; state.renewalWindow=null; state.search=''; render(); }));
  wrap.querySelectorAll('[data-status-group]').forEach(r=>r.addEventListener('click', ()=>{ state.view='list'; state.statusFilter='All'; state.ownerFilter='All'; state.renewalWindow=null; state.search=''; render(); }));
  wrap.querySelectorAll('[data-renewal]').forEach(r=>r.addEventListener('click', ()=>{ state.view='list'; state.renewalWindow=Number(r.dataset.renewal); state.statusFilter='All'; state.ownerFilter='All'; state.search=''; render(); }));
  wrap.querySelectorAll('[data-module]').forEach(r=>r.addEventListener('click', ()=>{ state.expandedModule = state.expandedModule===r.dataset.module ? null : r.dataset.module; render(); }));
  wrap.querySelectorAll('[data-mrr]').forEach(r=>r.addEventListener('click', ()=>{ state.expandedMrr = state.expandedMrr===r.dataset.mrr ? null : r.dataset.mrr; render(); }));
  const taskNav = wrap.querySelector('[data-nav-tasks]');
  if(taskNav) taskNav.addEventListener('click', ()=>{ state.view='team'; render(); });
  wrap.querySelectorAll('[data-owner-row]').forEach(r=>r.addEventListener('click', ()=>{
    state.view='list'; state.statusFilter='All'; state.renewalWindow=null; state.search='';
    state.ownerFilter = r.dataset.ownerRow==='Unassigned' ? '' : r.dataset.ownerRow;
    render();
  }));
  const raSearchEl = wrap.querySelector('#ra-search');
  if(raSearchEl) raSearchEl.addEventListener('input', e=>{ state.raSearch=e.target.value; render(); });
  const raWindowEl = wrap.querySelector('#ra-window');
  if(raWindowEl) raWindowEl.addEventListener('change', e=>{ state.raWindow=e.target.value; render(); });
  const raOwnerEl = wrap.querySelector('#ra-owner');
  if(raOwnerEl) raOwnerEl.addEventListener('change', e=>{ state.raOwner=e.target.value; render(); });
  const raStatusEl = wrap.querySelector('#ra-status');
  if(raStatusEl) raStatusEl.addEventListener('change', e=>{ state.raStatus=e.target.value; render(); });
  wrap.querySelectorAll('#renewal-analytics [data-open]').forEach(r=>r.addEventListener('click', ()=>goToCustomer(r.dataset.open)));
  return wrap;
}

const USER_BANDS = [
  { key:'0', label:'0 users', test:n=>n===0 },
  { key:'1-9', label:'1–9 users', test:n=>n>=1 && n<=9 },
  { key:'10-49', label:'10–49 users', test:n=>n>=10 && n<=49 },
  { key:'50-199', label:'50–199 users', test:n=>n>=50 && n<=199 },
  { key:'200+', label:'200+ users', test:n=>n>=200 },
];

function renderList(){
  const wrap = document.createElement('div');
  const s = computeStats();
  let renewalLabel = null;
  const q = state.search.trim().toLowerCase();
  let list = state.customers.filter(c=>{
    const matchesSearch = !q
      || c.name.toLowerCase().includes(q)
      || (c.contact||'').toLowerCase().includes(q)
      || (c.email||'').toLowerCase().includes(q)
      || (c.accountManager||'').toLowerCase().includes(q)
      || (c.owner||'').toLowerCase().includes(q);
    const matchesStatus = state.statusFilter==='All' || c.status===state.statusFilter;
    const matchesOwner = state.ownerFilter==='All' || (c.owner||'')===state.ownerFilter;
    const band = USER_BANDS.find(b=>b.key===state.usersFilter);
    const matchesUsers = !band || band.test(Number(c.numUsers)||0);
    let matchesRenewal = true;
    if(state.renewalWindow){
      const d = c.renewalDate ? daysUntil(c.renewalDate) : null;
      const lo = state.renewalWindow===30?0 : state.renewalWindow===60?31:61;
      matchesRenewal = d!==null && d>=lo && d<=state.renewalWindow;
      renewalLabel = state.renewalWindow===30?'Renewing in the next 30 days' : state.renewalWindow===60?'Renewing in 31–60 days' : 'Renewing in 61–90 days';
    }
    return matchesSearch && matchesStatus && matchesOwner && matchesUsers && matchesRenewal;
  });
  const filtersActive = !!q || state.statusFilter!=='All' || state.ownerFilter!=='All' || !!state.usersFilter || !!state.renewalWindow;

  wrap.innerHTML = `
    <div class="topbar">
      <div><h1 class="page-title">Customers</h1><div class="page-sub">${s.total} tracked</div></div>
      <button class="btn btn-primary" id="list-add">+ Add customer</button>
    </div>
    <div class="list-toolbar">
      <input class="search" id="search" placeholder="Search by company, contact, email, account manager or owner…" value="${escapeAttr(state.search)}">
      <select class="select" id="statusFilter">
        <option ${state.statusFilter==='All'?'selected':''}>All</option>
        ${STATUS_OPTIONS.map(o=>`<option ${state.statusFilter===o?'selected':''}>${o}</option>`).join('')}
      </select>
      <select class="select" id="ownerFilter">
        <option value="All" ${state.ownerFilter==='All'?'selected':''}>All owners</option>
        ${(state.customers.some(c=>!c.owner)?['Unassigned',...state.owners]:state.owners).map(o=>{ const v = o==='Unassigned'?'':o; return `<option value="${escapeAttr(v)}" ${state.ownerFilter===v?'selected':''}>${o}</option>`; }).join('')}
      </select>
      <select class="select" id="usersFilter">
        <option value="" ${state.usersFilter===''?'selected':''}>Any no. of users</option>
        ${USER_BANDS.map(b=>`<option value="${b.key}" ${state.usersFilter===b.key?'selected':''}>${b.label}</option>`).join('')}
      </select>
      ${renewalLabel ? `<span class="filter-chip">${renewalLabel} <button id="clear-renewal">✕</button></span>` : ''}
      ${filtersActive ? `<button class="btn btn-ghost" id="clear-filters">Clear filters</button>` : ''}
    </div>
    <div class="page-sub" style="margin:-8px 0 12px;">${list.length} of ${s.total} customers shown</div>
    ${state.customers.length===0 ? `
      <div class="panel empty"><div class="serif">No customers yet</div><div style="margin-bottom:16px;">Add your first customer to start tracking them here.</div></div>` : `
      <table>
        <thead><tr><th>Company</th><th>Status</th><th>Account manager</th><th>Owner</th><th>Users</th><th>MRR</th><th>Renewal</th><th>Last contact</th><th>Open</th></tr></thead>
        <tbody>
          ${list.map(c=>{
            const openT = (c.tickets||[]).filter(t=>t.status==='Open'||t.status==='In Progress').length;
            const openTk = (c.tasks||[]).filter(t=>t.status!=='Completed').length;
            const rd = daysUntil(c.renewalDate);
            return `<tr data-open="${c.id}">
              <td><div class="cell-name">${escapeHtml(c.name)}</div><div class="cell-sub">${escapeHtml(c.contact||'')}</div></td>
              <td><span class="${pillClass(c.status)}">${c.status}</span></td>
              <td>${escapeHtml(c.accountManager||'—')}</td>
              <td>${escapeHtml(c.owner||'—')}</td>
              <td>${Number(c.numUsers)||0}</td>
              <td>${money(c.mrr)}</td>
              <td>${c.renewalDate? fmtDate(c.renewalDate) + (rd!==null? ' <span class="cell-sub">('+(rd>=0?'in '+rd+'d':(-rd)+'d ago')+')</span>':'') : '—'}</td>
              <td>${c.lastContact? fmtDate(c.lastContact) : '—'}</td>
              <td>${openT||0} tix · ${openTk||0} tasks</td>
            </tr>`;
          }).join('') || `<tr><td colspan="9" style="text-align:center;color:var(--ink-soft);padding:26px;">No customers match your filters.</td></tr>`}
        </tbody>
      </table>`}
  `;
  wrap.querySelector('#list-add').addEventListener('click', ()=>{ state.showAddCustomer=true; render(); });
  const searchEl = wrap.querySelector('#search');
  if(searchEl) searchEl.addEventListener('input', e=>{ state.search=e.target.value; render(); });
  const filterEl = wrap.querySelector('#statusFilter');
  if(filterEl) filterEl.addEventListener('change', e=>{ state.statusFilter=e.target.value; render(); });
  const ownerFilterEl = wrap.querySelector('#ownerFilter');
  if(ownerFilterEl) ownerFilterEl.addEventListener('change', e=>{ state.ownerFilter=e.target.value; render(); });
  const usersFilterEl = wrap.querySelector('#usersFilter');
  if(usersFilterEl) usersFilterEl.addEventListener('change', e=>{ state.usersFilter=e.target.value; render(); });
  const clearRenewal = wrap.querySelector('#clear-renewal');
  if(clearRenewal) clearRenewal.addEventListener('click', ()=>{ state.renewalWindow=null; render(); });
  const clearFilters = wrap.querySelector('#clear-filters');
  if(clearFilters) clearFilters.addEventListener('click', ()=>{ state.search=''; state.statusFilter='All'; state.ownerFilter='All'; state.usersFilter=''; state.renewalWindow=null; render(); });
  wrap.querySelectorAll('[data-open]').forEach(r=>r.addEventListener('click', ()=>goToCustomer(r.dataset.open)));
  return wrap;
}

function renderDetail(){
  const c = getCustomer(state.activeId);
  const wrap = document.createElement('div');
  if(!c){ wrap.innerHTML = '<div class="empty">Customer not found.</div>'; return wrap; }

  const back = document.createElement('button');
  back.className='btn btn-ghost'; back.textContent='← All customers'; back.style.marginBottom='14px';
  back.addEventListener('click', ()=>{ state.view='list'; render(); });
  wrap.appendChild(back);

  const head = document.createElement('div');
  head.className='detail-head';
  const openCount = (c.tickets||[]).filter(t=>t.status==='Open'||t.status==='In Progress').length;
  head.innerHTML = `
    <div>
      <h2 class="detail-name">${escapeHtml(c.name)}</h2>
      <div class="detail-meta">
        <span class="${pillClass(c.status)}">${c.status}</span>
        <span>${escapeHtml(c.contact||'No contact set')}</span>
        <span>${money(c.mrr)}/mo</span>
        <span>${Number(c.numUsers)||0} users</span>
        <span>Owner: ${escapeHtml(c.owner||'Unassigned')}</span>
        <span>Renews ${c.renewalDate? fmtDate(c.renewalDate) : '—'}</span>
        <span>Started ${c.createdAt? fmtDate(c.createdAt) : '—'}</span>
        <span>${openCount} open issue${openCount===1?'':'s'}</span>
      </div>
    </div>
    <button class="btn btn-danger" id="del-customer">Remove customer</button>
  `;
  wrap.appendChild(head);
  head.querySelector('#del-customer').addEventListener('click', ()=>{
    if(confirm('Remove '+c.name+'? This deletes all their notes, tasks and tickets.')){
      state.customers = state.customers.filter(x=>x.id!==c.id);
      deleteCustomerRemote(c.id);
      logAudit(`Removed customer ${c.name}`, null, c.name);
      state.view='list'; render();
    }
  });

  const tabs = document.createElement('div');
  tabs.className='tabs';
  const tabLabels = { overview:'Overview', billing:'Subscription & Revenue', tasks:'Tasks & work', usage:'Product usage', timeline:'Timeline & notes', tickets:'Support tickets' };
  Object.keys(tabLabels).forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tab'+(state.detailTab===t?' active':'');
    b.textContent = tabLabels[t];
    b.addEventListener('click', ()=>{ state.detailTab=t; render(); });
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  if(state.detailTab==='overview') wrap.appendChild(renderOverviewTab(c));
  if(state.detailTab==='billing') wrap.appendChild(renderBillingTab(c));
  if(state.detailTab==='tasks') wrap.appendChild(renderTasksTab(c));
  if(state.detailTab==='usage') wrap.appendChild(renderUsageTab(c));
  if(state.detailTab==='timeline') wrap.appendChild(renderTimelineTab(c));
  if(state.detailTab==='tickets') wrap.appendChild(renderTicketsTab(c));

  return wrap;
}

function renderOverviewTab(c){
  const wrap = document.createElement('div');
  const panel = document.createElement('div');
  panel.className='panel';
  panel.innerHTML = `<h3 style="margin-bottom:14px;">Company &amp; commercial details</h3><div class="field-grid" id="ov-fields"></div>`;
  const grid = panel.querySelector('#ov-fields');

  const textFields = [
    ['name','Company','text',c.name],
    ['contact','Contact person','text',c.contact],
    ['email','Email','text',c.email],
    ['phone','Phone','text',c.phone],
    ['accountManager','Account manager','text',c.accountManager],
  ];
  const selectFields = [
    ['status','Status',STATUS_OPTIONS,c.status],
    ['owner','Owner',['Unassigned',...state.owners],c.owner||'Unassigned'],
    ['billingCycle','Billing cycle',Object.keys(BILLING_CYCLES),c.billingCycle],
  ];
  textFields.forEach(([key,label,type,val])=>{
    const f = document.createElement('div'); f.className='field';
    f.innerHTML = `<label>${label}</label><input data-key="${key}" type="${type}" value="${escapeAttr(val==null?'':val)}">`;
    grid.appendChild(f);
  });
  selectFields.forEach(([key,label,options,val])=>{
    const f = document.createElement('div'); f.className='field';
    f.innerHTML = `<label>${label}</label><select data-key="${key}">${options.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
    grid.appendChild(f);
  });
  const dealField = document.createElement('div'); dealField.className='field';
  dealField.innerHTML = `<label>Deal value per cycle ($)</label><input data-key="dealValue" type="number" value="${escapeAttr(c.dealValue==null?'':c.dealValue)}">`;
  grid.appendChild(dealField);
  const usersField = document.createElement('div'); usersField.className='field';
  usersField.innerHTML = `<label>Number of users (current)</label><input data-key="numUsers" type="number" value="${escapeAttr(c.numUsers==null?'':c.numUsers)}">`;
  grid.appendChild(usersField);
  const mrrField = document.createElement('div'); mrrField.className='field';
  mrrField.innerHTML = `<label>MRR (auto-calculated)</label><div class="readonly">${money(computeMrrFor(c))}/mo</div>`;
  grid.appendChild(mrrField);
  [['renewalDate','Renewal date','date',c.renewalDate],['lastContact','Last contact','date',c.lastContact],['createdAt','Customer start date','date',c.createdAt]].forEach(([key,label,type,val])=>{
    const f = document.createElement('div'); f.className='field';
    f.innerHTML = `<label>${label}</label><input data-key="${key}" type="${type}" value="${escapeAttr(val==null?'':val)}">`;
    grid.appendChild(f);
  });

  grid.querySelectorAll('[data-key]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const key = e.target.dataset.key;
      let val = e.target.type==='number' ? Number(e.target.value) : e.target.value;
      if(key==='owner' && val==='Unassigned') val='';
      const label = e.target.closest('.field').querySelector('label').textContent;
      c[key] = val;
      recalcMrr(c);
      logAudit(`Updated ${label} for ${c.name}`, c.id, c.name, 'overview');
      persistCustomer(c);
      render();
      showToast('Saved — synced');
    });
  });
  wrap.appendChild(panel);

  const summaryLines = [];
  if(c.createdAt) summaryLines.push(`${escapeHtml(c.name)} started using ExcelHire on ${fmtDate(c.createdAt)}.`);
  if(c.billingCycle && c.dealValue) summaryLines.push(`Billed ${c.billingCycle.toLowerCase()} at ${money(c.dealValue)} per cycle — ${money(computeMrrFor(c))}/mo MRR.`);
  if(c.renewalDate) summaryLines.push(`Renews on ${fmtDate(c.renewalDate)}.`);
  if(c.lastContact) summaryLines.push(`Last contacted on ${fmtDate(c.lastContact)}.`);
  if(summaryLines.length){
    const sum = document.createElement('div'); sum.className='panel';
    sum.innerHTML = `<h3 style="margin-bottom:8px;">Summary</h3>${summaryLines.map(l=>`<p style="margin:0 0 6px;">${l}</p>`).join('')}`;
    wrap.appendChild(sum);
  }

  if((c.mrrEvents||[]).length){
    const mp = document.createElement('div'); mp.className='panel';
    mp.innerHTML = `<h3 style="margin-bottom:8px;">MRR history</h3><ul class="timeline">${c.mrrEvents.slice(0,10).map(ev=>`
      <li><div class="tl-date">${fmtDate(ev.date)}</div><div class="tl-body"><div class="tl-type">${ev.type}</div><div class="tl-text">${money(ev.amount)} — ${escapeHtml(ev.note||'')}</div></div></li>`).join('')}</ul>`;
    wrap.appendChild(mp);
  }
  return wrap;
}

function renderBillingTab(c){
  const wrap = document.createElement('div');
  const cycles = [...(c.subscriptionCycles||[])].sort((a,b)=> (b.startDate||'').localeCompare(a.startDate||''));
  const payments = [...(c.payments||[])].sort((a,b)=> (b.paymentDate||'').localeCompare(a.paymentDate||''));
  const addons = [...(c.addons||[])];
  const currentCycle = cycles[0] || null;
  const prevCycle = cycles[1] || null;

  const activeAddons = addons.filter(a=>a.status==='Active');
  const addonMonthly = activeAddons.reduce((s,a)=>s+(Number(a.monthlyAmount)||0),0);
  const totalMonthly = (Number(c.mrr)||0) + addonMonthly;

  const currentContractValue = currentCycle ? currentCycle.subscriptionAmount : (c.dealValue||0);
  const collectedForCurrentCycle = payments.filter(p=> currentCycle ? p.subscriptionCycleId===currentCycle.id : true)
    .filter(p=>p.status==='Paid'||p.status==='Partial').reduce((s,p)=>s+(Number(p.amount)||0),0);
  const outstanding = Math.max(0, currentContractValue - collectedForCurrentCycle);
  const lifetimeRevenue = payments.filter(p=>p.status==='Paid'||p.status==='Partial').reduce((s,p)=>s+(Number(p.amount)||0),0);

  const summary = document.createElement('div');
  summary.className='panel';
  summary.innerHTML = `
    <h3 style="margin-bottom:14px;">Revenue summary</h3>
    <div class="revenue-grid">
      <div class="rev-stat"><div class="rev-label">Current contract value</div><div class="rev-num">${money(currentContractValue)}</div></div>
      <div class="rev-stat"><div class="rev-label">Number of users</div><div class="rev-num">${Number(c.numUsers)||0}</div></div>
      <div class="rev-stat"><div class="rev-label">Base MRR</div><div class="rev-num">${money(c.mrr)}</div></div>
      <div class="rev-stat"><div class="rev-label">Add-on revenue /mo</div><div class="rev-num">${money(addonMonthly)}</div></div>
      <div class="rev-stat"><div class="rev-label">Total monthly revenue</div><div class="rev-num">${money(totalMonthly)}</div></div>
      <div class="rev-stat"><div class="rev-label">Collected (current cycle)</div><div class="rev-num">${money(collectedForCurrentCycle)}</div></div>
      <div class="rev-stat"><div class="rev-label">Outstanding (current cycle)</div><div class="rev-num" style="color:${outstanding>0?'var(--red)':'inherit'}">${money(outstanding)}</div></div>
      <div class="rev-stat"><div class="rev-label">Lifetime revenue collected</div><div class="rev-num">${money(lifetimeRevenue)}</div></div>
    </div>
    ${prevCycle && currentCycle ? `<div class="panel-sub" style="margin-top:12px;">Last renewal on ${fmtDate(currentCycle.startDate)}: ${prevCycle.numUsers} → ${currentCycle.numUsers} users (${currentCycle.numUsers-prevCycle.numUsers>=0?'+':''}${currentCycle.numUsers-prevCycle.numUsers}), ${money(prevCycle.subscriptionAmount)} → ${money(currentCycle.subscriptionAmount)} (${currentCycle.subscriptionAmount-prevCycle.subscriptionAmount>=0?'+':''}${money(currentCycle.subscriptionAmount-prevCycle.subscriptionAmount)})</div>` : ''}
  `;
  wrap.appendChild(summary);

  const cyclesPanel = document.createElement('div');
  cyclesPanel.className='panel';
  cyclesPanel.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h3 style="margin:0;">Subscription cycles (renewal history)</h3>
      <button class="btn btn-primary btn-sm" id="cyc-add-toggle">+ New cycle / renewal</button>
    </div>
    <div id="cyc-form-wrap"></div>
    <div id="cyc-list" style="overflow-x:auto;"></div>`;
  wrap.appendChild(cyclesPanel);
  const cycFormWrap = cyclesPanel.querySelector('#cyc-form-wrap');
  cyclesPanel.querySelector('#cyc-add-toggle').addEventListener('click', ()=>{
    cycFormWrap.innerHTML='';
    cycFormWrap.appendChild(renderCycleForm(c, currentCycle));
  });
  const cycList = cyclesPanel.querySelector('#cyc-list');
  if(cycles.length===0){
    cycList.innerHTML = `<div class="empty"><div class="serif">No subscription cycles recorded</div>Log the first cycle above — this never overwrites, so every renewal stays visible.</div>`;
  } else {
    cycList.innerHTML = `<table><thead><tr><th>Start</th><th>End</th><th>Users</th><th>$/user</th><th>Billing</th><th>Amount</th><th>Renewal</th><th>Status</th><th>Note</th></tr></thead><tbody>${
      cycles.map((s,i)=>`<tr${i===0?' style="font-weight:600;"':''}>
        <td>${fmtDate(s.startDate)}</td><td>${s.endDate?fmtDate(s.endDate):'—'}</td><td>${s.numUsers}</td><td>${money(s.pricePerUser)}</td>
        <td>${escapeHtml(s.billingCycle)}</td><td>${money(s.subscriptionAmount)}</td><td>${s.renewalDate?fmtDate(s.renewalDate):'—'}</td>
        <td><span class="${pillClass(s.status)}">${s.status}</span></td><td>${escapeHtml(s.note||'')}</td>
      </tr>`).join('')
    }</tbody></table>`;
  }

  const payPanel = document.createElement('div');
  payPanel.className='panel';
  payPanel.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h3 style="margin:0;">Payment history</h3>
      <button class="btn btn-primary btn-sm" id="pay-add-toggle">+ Log payment</button>
    </div>
    <div id="pay-form-wrap"></div>
    <div id="pay-list" style="overflow-x:auto;"></div>`;
  wrap.appendChild(payPanel);
  const payFormWrap = payPanel.querySelector('#pay-form-wrap');
  payPanel.querySelector('#pay-add-toggle').addEventListener('click', ()=>{
    payFormWrap.innerHTML='';
    payFormWrap.appendChild(renderPaymentForm(c, cycles));
  });
  const payList = payPanel.querySelector('#pay-list');
  if(payments.length===0){
    payList.innerHTML = `<div class="empty"><div class="serif">No payments recorded</div>Log a payment above when money actually comes in — this is separate from contract value.</div>`;
  } else {
    payList.innerHTML = `<table><thead><tr><th>Date</th><th>Amount</th><th>Product</th><th>Billing period</th><th>Status</th><th>Invoice ref</th><th>Cycle</th></tr></thead><tbody>${
      payments.map(p=>{
        const cyc = cycles.find(s=>s.id===p.subscriptionCycleId);
        return `<tr><td>${p.paymentDate?fmtDate(p.paymentDate):'—'}</td><td>${money(p.amount)}</td><td>${escapeHtml(p.product)}</td>
        <td>${escapeHtml(p.billingPeriod||'—')}</td><td><span class="${pillClass(p.status)}">${p.status}</span></td>
        <td>${escapeHtml(p.invoiceRef||'—')}</td><td>${cyc? fmtDate(cyc.startDate)+' cycle':'—'}</td></tr>`;
      }).join('')
    }</tbody></table>`;
  }

  const addonPanel = document.createElement('div');
  addonPanel.className='panel';
  addonPanel.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h3 style="margin:0;">Add-ons</h3>
      <button class="btn btn-primary btn-sm" id="addon-add-toggle">+ Add add-on</button>
    </div>
    <div id="addon-form-wrap"></div>
    <div id="addon-list"></div>`;
  wrap.appendChild(addonPanel);
  const addonFormWrap = addonPanel.querySelector('#addon-form-wrap');
  addonPanel.querySelector('#addon-add-toggle').addEventListener('click', ()=>{
    addonFormWrap.innerHTML='';
    addonFormWrap.appendChild(renderAddonForm(c));
  });

        <div class="ticket-pills"><span class="${pillClass(a.status)}">${a.status}</span></div>
      </div>
      <div class="add-form-row" style="margin-top:10px;margin-bottom:0;">
        <select data-addon-status><option ${a.status==='Active'?'selected':''}>Active</option><option ${a.status==='Paused'?'selected':''}>Paused</option><option ${a.status==='Cancelled'?'selected':''}>Cancelled</option></select>
        <button class="btn btn-ghost btn-sm" data-edit-toggle>Edit</button>
        <button class="btn btn-ghost btn-sm" data-delete style="color:var(--red);">Delete</button>
      </div>

        <div class="add-form-row">
          <input data-edit-name value="${escapeAttr(a.name)}" placeholder="Add-on name" style="flex:2;min-width:160px;">
          <input data-edit-amount type="number" value="${a.monthlyAmount||0}" placeholder="$/mo" style="max-width:120px;">
          <input data-edit-start type="date" value="${a.startDate||''}">
        </div>
        <div class="add-form-row" style="margin-top:8px;margin-bottom:0;">
          <button class="btn btn-primary btn-sm" data-edit-save>Save changes</button>
          <button class="btn btn-sm" data-edit-cancel>Cancel</button>
        </div>
      </div>`;
      row.querySelector('[data-addon-status]').addEventListener('change', e=>{
        a.status = e.target.value;
        if(a.status!=='Active' && !a.endDate) a.endDate = todayISO();
        logAudit(`${state.actor||'Someone'} set add-on "${a.name}" to ${a.status} for ${c.name}`, c.id, c.name, 'billing');
        persistCustomer(c); render();
      });
      row.querySelector('[data-edit-toggle]').addEventListener('click', ()=>{
        const body = row.querySelector('[data-edit-body]');
        body.style.display = body.style.display==='none' ? 'block' : 'none';
      });
      row.querySelector('[data-edit-cancel]').addEventListener('click', ()=>{
        row.querySelector('[data-edit-body]').style.display = 'none';
      });
      row.querySelector('[data-edit-save]').addEventListener('click', ()=>{
        const newName = row.querySelector('[data-edit-name]').value.trim();
        if(!newName){ showToast('Add-on name is required'); return; }
        a.name = newName;
        a.monthlyAmount = Number(row.querySelector('[data-edit-amount]').value)||0;
        a.startDate = row.querySelector('[data-edit-start]').value||a.startDate;
        logAudit(`${state.actor||'Someone'} edited add-on "${newName}" for ${c.name}`, c.id, c.name, 'billing');
        persistCustomer(c); render(); showToast('Add-on updated');
      });
      row.querySelector('[data-delete]').addEventListener('click', ()=>{
        if(!confirm(`Remove add-on "${a.name}"? This can't be undone.`)) return;
        c.addons = (c.addons||[]).filter(x=>x.id!==a.id);
        logAudit(`${state.actor||'Someone'} removed add-on "${a.name}" for ${c.name}`, c.id, c.name, 'billing');
        sbDelete('addons', { id: a.id }).catch(e=>{ console.error(e); showToast('Delete failed — try again.'); });
        render(); showToast('Add-on removed');
      });
      addonList.appendChild(row);
    });
  }

  return wrap;
}

function renderCycleForm(c, currentCycle){
  const form = document.createElement('div');
  form.className='add-form';
  const defUsers = currentCycle ? currentCycle.numUsers : (c.numUsers||0);
  const defAmount = currentCycle ? currentCycle.subscriptionAmount : (c.dealValue||0);
  const defCycle = currentCycle ? currentCycle.billingCycle : (c.billingCycle||'Monthly');
  form.innerHTML = `
    <div class="add-form-row">
      <input id="cyc-users" type="number" placeholder="Number of users" value="${defUsers}">
      <input id="cyc-price" type="number" placeholder="Price per user" value="${defUsers>0?Math.round((defAmount/defUsers)*100)/100:0}">
      <select id="cyc-billing">${Object.keys(BILLING_CYCLES).map(o=>`<option ${o===defCycle?'selected':''}>${o}</option>`).join('')}</select>
      <input id="cyc-amount" type="number" placeholder="Subscription / cycle amount" value="${defAmount}">
    </div>
    <div class="add-form-row">
      <input id="cyc-start" type="date" value="${todayISO()}">
      <input id="cyc-end" type="date">
      <input id="cyc-renewal" type="date" value="${c.renewalDate||''}">
      <select id="cyc-status"><option selected>Active</option><option>Upcoming</option><option>Expired</option></select>
    </div>
    <textarea id="cyc-note" placeholder="Note (e.g. expansion, downgrade, reason)"></textarea>
    <div class="add-form-row" style="margin-top:8px;margin-bottom:0;">
      <button class="btn btn-primary" id="cyc-save">Save cycle</button>
    </div>
  `;
  form.querySelector('#cyc-save').addEventListener('click', ()=>{
    const numUsers = Number(form.querySelector('#cyc-users').value)||0;
    const pricePerUser = Number(form.querySelector('#cyc-price').value)||0;
    const billingCycle = form.querySelector('#cyc-billing').value;
    const subscriptionAmount = Number(form.querySelector('#cyc-amount').value)||0;
    const startDate = form.querySelector('#cyc-start').value||todayISO();
    const endDate = form.querySelector('#cyc-end').value||'';
    const renewalDate = form.querySelector('#cyc-renewal').value||'';
    const status = form.querySelector('#cyc-status').value;
    if(subscriptionAmount<=0){ showToast('Subscription amount is required'); return; }
    c.subscriptionCycles = c.subscriptionCycles || [];
    c.subscriptionCycles.unshift({ id:uid(), numUsers, pricePerUser, billingCycle, subscriptionAmount, startDate, endDate, renewalDate, status, note: form.querySelector('#cyc-note').value.trim() });
    c.numUsers = numUsers; c.dealValue = subscriptionAmount; c.billingCycle = billingCycle; c.renewalDate = renewalDate;
    recalcMrr(c);
    logAudit(`${state.actor||'Someone'} logged a new subscription cycle (${numUsers} users, ${money(subscriptionAmount)}) for ${c.name}`, c.id, c.name, 'billing');
    persistCustomer(c); render(); showToast('Cycle saved');
  });
  return form;
}
