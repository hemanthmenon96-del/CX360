function renderTasksTab(c){
  const wrap = document.createElement('div');
  const form = document.createElement('div');
  form.className='add-form';
  form.innerHTML = `
    <div class="add-form-row">
      <input id="tk-title" placeholder="Task title" style="flex:2;min-width:200px;">
      <select id="tk-type">${TASK_TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
      <select id="tk-owner">${['Unassigned',...state.owners].map(o=>`<option ${o===state.actor?'selected':''}>${o}</option>`).join('')}</select>
      <input id="tk-due" type="date" placeholder="Due date">
    </div>
    <textarea id="tk-notes" placeholder="Notes / details"></textarea>
    <div class="add-form-row" style="margin-top:8px;margin-bottom:0;">
      <button class="btn btn-primary" id="tk-add">+ Add task</button>
    </div>
  `;
  wrap.appendChild(form);
  form.querySelector('#tk-add').addEventListener('click', ()=>{
    const titleInput = form.querySelector('#tk-title');
    const title = titleInput.value.trim();
    if(!title){ titleInput.style.borderColor='var(--red)'; titleInput.focus(); showToast('Task title is required'); return; }
    titleInput.style.borderColor='';
    const owner = form.querySelector('#tk-owner').value;
    c.tasks = c.tasks || [];
    const task = {
      id:uid(), title, type:form.querySelector('#tk-type').value, status:'To Do',
      owner: owner==='Unassigned'?'':owner, dueDate: form.querySelector('#tk-due').value||'',
      timeSpent:0, notes: form.querySelector('#tk-notes').value.trim(),
      createdBy: state.actor||'Unassigned', createdDate: todayISO(),
      updatedBy: state.actor||'Unassigned', updatedDate: todayISO(), completedDate:null,
      history: [{id:uid(), ts:nowISO(), actor:state.actor||'Unassigned', action:'created this task'}],
    };
    c.tasks.unshift(task);
    logAudit(`${state.actor||'Someone'} created task "${title}" for ${c.name}`, c.id, c.name, 'tasks');
    persistCustomer(c); render(); showToast('Task added');
  });

  const tasks = (c.tasks||[]);
  const todo = tasks.filter(t=>t.status==='To Do').length;
  const inProg = tasks.filter(t=>t.status==='In Progress').length;
  const done = tasks.filter(t=>t.status==='Completed').length;
  const totalTime = tasks.reduce((s,t)=>s+(Number(t.timeSpent)||0),0);

  const summary = document.createElement('div');
  summary.className='panel-sub';
  summary.style.marginBottom='14px';
  summary.textContent = `${todo} to do · ${inProg} in progress · ${done} completed · ${fmtMinutes(totalTime)} logged`;
  wrap.appendChild(summary);

  const listPanel = document.createElement('div');
  if(tasks.length===0){
    listPanel.className='panel';
    listPanel.innerHTML = `<div class="empty"><div class="serif">No tasks logged</div>Add the first piece of work above — a call, a deliverable, an issue to fix.</div>`;
  } else {
    tasks.forEach(t=>{
      const card = document.createElement('div');
      card.className='task-card';
      card.innerHTML = `
        <div class="task-top">
          <div>
            <div class="task-title">${escapeHtml(t.title)}</div>
            <div class="task-meta">${escapeHtml(t.type)} · owner ${escapeHtml(t.owner||'Unassigned')} · created by ${escapeHtml(t.createdBy)} on ${fmtDate(t.createdDate)}${t.dueDate? ' · due '+fmtDate(t.dueDate):''}${t.completedDate? ' · completed '+fmtDate(t.completedDate):''}</div>
            ${t.notes? `<div class="task-meta" style="margin-top:4px;color:var(--ink);">${escapeHtml(t.notes)}</div>`:''}
          </div>
          <div class="task-pills">
            <span class="${pillClass(t.status)}">${t.status}</span>
            <button class="btn btn-ghost btn-sm" data-edit-toggle>Edit</button>
            <button class="btn btn-ghost btn-sm" data-delete style="color:var(--red);">Delete</button>
          </div>
        </div>
        <div class="task-controls">
          <select data-status>${TASK_STATUSES.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select>
          <select data-owner>${['Unassigned',...state.owners].map(o=>`<option ${((t.owner||'Unassigned')===o)?'selected':''}>${o}</option>`).join('')}</select>
          <span style="font-size:12.5px;color:var(--ink-soft);">Time (min)</span>
          <input data-time type="number" value="${t.timeSpent||0}" style="width:70px;">
        </div>
        <div class="task-edit-form" data-edit-body style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);">
          <div class="add-form-row">
            <input data-edit-title value="${escapeAttr(t.title)}" placeholder="Task title" style="flex:2;min-width:180px;">
            <select data-edit-type>${TASK_TYPES.map(ty=>`<option ${t.type===ty?'selected':''}>${ty}</option>`).join('')}</select>
            <input data-edit-due type="date" value="${t.dueDate||''}">
          </div>
          <textarea data-edit-notes placeholder="Notes / details">${escapeHtml(t.notes||'')}</textarea>
          <div class="add-form-row" style="margin-top:8px;margin-bottom:0;">
            <button class="btn btn-primary btn-sm" data-edit-save>Save changes</button>
            <button class="btn btn-sm" data-edit-cancel>Cancel</button>
          </div>
        </div>
        <button class="task-history-toggle" data-hist>Show history (${(t.history||[]).length})</button>
        <div class="task-history" data-hist-body style="display:none;"></div>
      `;
      card.querySelector('[data-status]').addEventListener('change', e=>{
        const newStatus = e.target.value;
        t.status = newStatus;
        t.updatedBy = state.actor||'Unassigned'; t.updatedDate = todayISO();
        if(newStatus==='Completed'){ t.completedDate = t.completedDate||todayISO(); }
        else { t.completedDate = null; }
        t.history = t.history||[];
        t.history.unshift({id:uid(), ts:nowISO(), actor:state.actor||'Unassigned', action:`changed status to ${newStatus}`});
        logAudit(`${state.actor||'Someone'} marked "${t.title}" as ${newStatus} for ${c.name}`, c.id, c.name, 'tasks');
        persistCustomer(c); render();
      });
      card.querySelector('[data-owner]').addEventListener('change', e=>{
        const newOwner = e.target.value==='Unassigned'?'':e.target.value;
        t.owner = newOwner;
        t.updatedBy = state.actor||'Unassigned'; t.updatedDate = todayISO();
        t.history = t.history||[];
        t.history.unshift({id:uid(), ts:nowISO(), actor:state.actor||'Unassigned', action:`reassigned to ${newOwner||'Unassigned'}`});
        logAudit(`${state.actor||'Someone'} reassigned "${t.title}" to ${newOwner||'Unassigned'} for ${c.name}`, c.id, c.name, 'tasks');
        persistCustomer(c); render();
      });
      card.querySelector('[data-time]').addEventListener('change', e=>{
        t.timeSpent = Number(e.target.value)||0;
        t.updatedBy = state.actor||'Unassigned'; t.updatedDate = todayISO();
        t.history = t.history||[];
        t.history.unshift({id:uid(), ts:nowISO(), actor:state.actor||'Unassigned', action:`logged ${fmtMinutes(t.timeSpent)}`});
        logAudit(`${state.actor||'Someone'} logged ${fmtMinutes(t.timeSpent)} on "${t.title}" for ${c.name}`, c.id, c.name, 'tasks');
        persistCustomer(c); render();
      });
      card.querySelector('[data-edit-toggle]').addEventListener('click', ()=>{
        const body = card.querySelector('[data-edit-body]');
        body.style.display = body.style.display==='none' ? 'block' : 'none';
      });
      card.querySelector('[data-edit-cancel]').addEventListener('click', ()=>{
        card.querySelector('[data-edit-body]').style.display = 'none';
      });
      card.querySelector('[data-edit-save]').addEventListener('click', ()=>{
        const newTitle = card.querySelector('[data-edit-title]').value.trim();
        if(!newTitle) return;
        const changes = [];
        if(newTitle!==t.title) changes.push('title');
        const newType = card.querySelector('[data-edit-type]').value;
        if(newType!==t.type) changes.push('type');
        const newDue = card.querySelector('[data-edit-due]').value||'';
        if(newDue!==(t.dueDate||'')) changes.push('due date');
        const newNotes = card.querySelector('[data-edit-notes]').value.trim();
        if(newNotes!==(t.notes||'')) changes.push('notes');
        t.title = newTitle; t.type = newType; t.dueDate = newDue; t.notes = newNotes;
        t.updatedBy = state.actor||'Unassigned'; t.updatedDate = todayISO();
        t.history = t.history||[];
        t.history.unshift({id:uid(), ts:nowISO(), actor:state.actor||'Unassigned', action: changes.length? `edited ${changes.join(', ')}` : 'edited task details'});
        logAudit(`${state.actor||'Someone'} edited task "${newTitle}" for ${c.name}`, c.id, c.name, 'tasks');
        persistCustomer(c); render(); showToast('Task updated');
      });
      card.querySelector('[data-hist]').addEventListener('click', e=>{
        const body = card.querySelector('[data-hist-body]');
        const showing = body.style.display!=='none';
        body.style.display = showing? 'none':'block';
        e.target.textContent = showing? `Show history (${(t.history||[]).length})` : `Hide history`;
        if(!showing){
          body.innerHTML = (t.history||[]).map(h=>`<div>${fmtDateTime(h.ts)} — <strong>${escapeHtml(h.actor)}</strong> ${escapeHtml(h.action)}</div>`).join('') || 'No history yet.';
        }
      });
      card.querySelector('[data-delete]').addEventListener('click', ()=>{
        if(!confirm(`Delete task "${t.title}"? This can't be undone.`)) return;
        c.tasks = (c.tasks||[]).filter(x=>x.id!==t.id);
        logAudit(`${state.actor||'Someone'} deleted task "${t.title}" for ${c.name}`, c.id, c.name, 'tasks');
        deleteTaskRemote(t.id);
        render(); showToast('Task deleted');
      });
      listPanel.appendChild(card);
    });
  }
  wrap.appendChild(listPanel);
  return wrap;
}

          <button class="btn btn-primary btn-sm" data-edit-save>Save changes</button>
          <button class="btn btn-sm" data-edit-cancel>Cancel</button>
        </div>
      </div>`;
      row.querySelector('[data-edit-toggle]').addEventListener('click', ()=>{
        const body = row.querySelector('[data-edit-body]');
        body.style.display = body.style.display==='none' ? 'block' : 'none';
      });
      row.querySelector('[data-edit-cancel]').addEventListener('click', ()=>{
        row.querySelector('[data-edit-body]').style.display = 'none';
      });
      row.querySelector('[data-edit-save]').addEventListener('click', ()=>{
        u.feature = row.querySelector('[data-edit-feature]').value;
        u.startDate = row.querySelector('[data-edit-date]').value||u.startDate;
        u.status = row.querySelector('[data-edit-status]').value;
        u.paid = row.querySelector('[data-edit-paid]').checked;
        u.paidStartDate = u.paid ? (row.querySelector('[data-edit-paid-date]').value||u.startDate) : '';
        u.note = row.querySelector('[data-edit-note]').value.trim();
        logAudit(`${state.actor||'Someone'} edited feature usage "${u.feature}" for ${c.name}`, c.id, c.name, 'usage');
        persistCustomer(c); render(); showToast('Feature usage updated');
      });
      row.querySelector('[data-delete]').addEventListener('click', ()=>{
        if(!confirm(`Delete "${u.feature}" usage entry? This can't be undone.`)) return;
        c.featureUsage = (c.featureUsage||[]).filter(x=>x.id!==u.id);
        logAudit(`${state.actor||'Someone'} deleted feature usage "${u.feature}" for ${c.name}`, c.id, c.name, 'usage');
        sbDelete('feature_usage', { id: u.id }).catch(e=>{ console.error(e); showToast('Delete failed — try again.'); });
        render(); showToast('Feature usage deleted');
      });
      panel.appendChild(row);
    });
  }
  wrap.appendChild(panel);
  return wrap;
}

        <div class="ticket-meta" data-view-meta>${escapeHtml(t.module)} · opened ${fmtDate(t.createdDate)}${t.resolvedDate? ' · resolved '+fmtDate(t.resolvedDate):''} · assigned to ${escapeHtml(t.assignedTo||'Unassigned')}</div>

        <select data-edit-module>${MODULES.map(m=>`<option ${t.module===m?'selected':''}>${m}</option>`).join('')}</select>
        <select data-edit-priority>${PRIORITIES.map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select>

        <button class="btn btn-sm" data-edit-cancel>Cancel</button>
      </div>
    </div>
  `;
  if(opts.showCustomerLink){
    card.querySelector('[data-open]').addEventListener('click', ()=>goToCustomer(c.id,'tickets'));
  }
  card.querySelector('[data-status]').addEventListener('change', e=>{
    t.status = e.target.value;
    t.resolvedDate = (t.status==='Resolved'||t.status==='Closed') ? (t.resolvedDate||todayISO()) : null;
    logAudit(`${state.actor||'Someone'} marked ticket "${t.title}" as ${t.status} for ${c.name}`, c.id, c.name, 'tickets');
    persistCustomer(c); render();
  });
  card.querySelector('[data-assignee]').addEventListener('change', e=>{
    t.assignedTo = e.target.value==='Unassigned' ? '' : e.target.value;
    logAudit(`${state.actor||'Someone'} assigned ticket "${t.title}" to ${e.target.value} for ${c.name}`, c.id, c.name, 'tickets');
    persistCustomer(c); render();
  });
  card.querySelector('[data-edit-toggle]').addEventListener('click', ()=>{
    const body = card.querySelector('[data-edit-body]');
    body.style.display = body.style.display==='none' ? 'block' : 'none';
  });
  card.querySelector('[data-edit-cancel]').addEventListener('click', ()=>{
    card.querySelector('[data-edit-body]').style.display = 'none';
  });
  card.querySelector('[data-edit-save]').addEventListener('click', ()=>{
    const newTitle = card.querySelector('[data-edit-title]').value.trim();
    if(!newTitle){ showToast('Subject is required'); return; }
    t.title = newTitle;
    t.module = card.querySelector('[data-edit-module]').value;
    t.priority = card.querySelector('[data-edit-priority]').value;
    t.notes = card.querySelector('[data-edit-notes]').value.trim();
    logAudit(`${state.actor||'Someone'} edited ticket "${newTitle}" for ${c.name}`, c.id, c.name, 'tickets');
    persistCustomer(c); render(); showToast('Ticket updated');
  });
  card.querySelector('[data-delete]').addEventListener('click', ()=>{
    if(!confirm(`Delete ticket "${t.title}"? This can't be undone.`)) return;
    c.tickets = (c.tickets||[]).filter(x=>x.id!==t.id);
    logAudit(`${state.actor||'Someone'} deleted ticket "${t.title}" for ${c.name}`, c.id, c.name, 'tickets');
    deleteTicketRemote(t.id);
    render(); showToast('Ticket deleted');
  });
  return card;
}

function renderTicketsView(){
  const wrap = document.createElement('div');
  const all = [];
  state.customers.forEach(c=> (c.tickets||[]).forEach(t=> all.push({...t, customerId:c.id, customerName:c.name})));
  all.sort((a,b)=> (b.createdDate||'').localeCompare(a.createdDate||''));
  const hasUnassignedTicket = all.some(t=>!t.assignedTo);
  const assignees = Array.from(new Set([...(hasUnassignedTicket?['Unassigned']:[]), ...state.owners])).filter(a=>a);

  wrap.innerHTML = `<div class="topbar">
    <div><h1 class="page-title">Tickets</h1><div class="page-sub">Every support ticket across all customers, in one queue.</div></div>
    <button class="btn btn-primary" id="tix-add">+ Add ticket</button>
  </div>
  <div class="panel" style="margin-bottom:14px;">
    <div class="add-form-row">
      <input id="tix-search" placeholder="Search subject or company…" value="${escapeAttr(state.ticketSearch)}" style="flex:2;min-width:200px;">
      <select id="tix-status">${['All',...TICKET_STATUSES].map(s=>`<option ${state.ticketStatusFilter===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="tix-priority">${['All',...PRIORITIES].map(p=>`<option ${state.ticketPriorityFilter===p?'selected':''}>${p}</option>`).join('')}</select>
      <select id="tix-assignee">${['All',...assignees].map(a=>`<option ${state.ticketAssigneeFilter===a?'selected':''}>${a}</option>`).join('')}</select>
    </div>
  </div>
  <div id="tix-list"></div>`;

  wrap.querySelector('#tix-add').addEventListener('click', ()=>{ state.showAddTicket=true; render(); });
  wrap.querySelector('#tix-search').addEventListener('input', e=>{ state.ticketSearch=e.target.value; render(); });
  wrap.querySelector('#tix-status').addEventListener('change', e=>{ state.ticketStatusFilter=e.target.value; render(); });
  wrap.querySelector('#tix-priority').addEventListener('change', e=>{ state.ticketPriorityFilter=e.target.value; render(); });
  wrap.querySelector('#tix-assignee').addEventListener('change', e=>{ state.ticketAssigneeFilter=e.target.value; render(); });

  let filtered = all;
  const q = state.ticketSearch.trim().toLowerCase();
  if(q) filtered = filtered.filter(t=> (t.title||'').toLowerCase().includes(q) || (t.customerName||'').toLowerCase().includes(q));
  if(state.ticketStatusFilter!=='All') filtered = filtered.filter(t=>t.status===state.ticketStatusFilter);
  if(state.ticketPriorityFilter!=='All') filtered = filtered.filter(t=>t.priority===state.ticketPriorityFilter);
  if(state.ticketAssigneeFilter!=='All') filtered = filtered.filter(t=>(t.assignedTo||'Unassigned')===state.ticketAssigneeFilter);

  const listWrap = wrap.querySelector('#tix-list');
  if(filtered.length===0){
    listWrap.innerHTML = `<div class="panel empty"><div class="serif">No tickets found</div>${all.length? 'Try clearing filters.' : 'Add one above when an issue comes in.'}</div>`;
  } else {
    filtered.forEach(t=>{
      const cust = getCustomer(t.customerId); if(!cust) return;
      const real = (cust.tickets||[]).find(x=>x.id===t.id); if(!real) return;
      listWrap.appendChild(renderTicketCard(real, cust, {showCustomerLink:true}));
    });
  }

  if(state.showAddTicket) wrap.appendChild(renderAddTicketModal());
  return wrap;
}

function renderTeam(){
  const wrap = document.createElement('div');
  const allTasks = [];
  state.customers.forEach(c=> (c.tasks||[]).forEach(t=> allTasks.push({...t, customerId:c.id, customerName:c.name})));

  const inRange = allTasks.filter(t=> inPeriodOrRange(t.createdDate, state.teamPeriod, state.teamFrom, state.teamTo) || inPeriodOrRange(t.updatedDate, state.teamPeriod, state.teamFrom, state.teamTo) || inPeriodOrRange(t.completedDate, state.teamPeriod, state.teamFrom, state.teamTo));
  const ownersActive = Array.from(new Set([...state.owners, ...allTasks.map(t=>t.owner||'Unassigned')]));

  wrap.innerHTML = `<div class="topbar">
    <div><h1 class="page-title">Team activity</h1><div class="page-sub">${state.teamPeriod==='today' ? "Today's report — " : ''}Who worked on what, for which customer — click through to any task.</div></div>
    <div id="team-period"></div>
  </div>
  <div class="panel">
    <h3 style="margin-bottom:8px;">Team</h3>
    <div class="panel-sub">Everyone who has signed in — new teammates appear here once they create an account.</div>
    <div id="owner-chips"></div>
  </div>
  <div id="team-cards"></div>`;

  wrap.querySelector('#team-period').appendChild(renderPeriodSelector(state.teamPeriod, key=>{ state.teamPeriod=key; render(); }, {
    from: state.teamFrom, to: state.teamTo,
    onFrom: v=>{ state.teamFrom=v; render(); },
    onTo: v=>{ state.teamTo=v; render(); },
  }));

  const chips = wrap.querySelector('#owner-chips');
  if(state.owners.length===0){ chips.innerHTML = '<div style="color:var(--ink-soft);font-size:13px;">No one has signed in yet.</div>'; }
  else {
    state.owners.forEach(o=>{
      const chip = document.createElement('span'); chip.className='owner-chip';
      chip.innerHTML = `<span class="owner-avatar">${initials(o)}</span>${escapeHtml(o)}`;
      chips.appendChild(chip);
    });
  }

  const cardsWrap = wrap.querySelector('#team-cards');
  const periodLabel = state.teamPeriod==='custom'
    ? (state.teamFrom||state.teamTo ? `${state.teamFrom?fmtDate(state.teamFrom):'…'} – ${state.teamTo?fmtDate(state.teamTo):'…'}` : 'Custom range')
    : (PERIODS.find(p=>p.key===state.teamPeriod)||PERIODS[0]).label;
  if(ownersActive.filter(o=>o).length===0){
    cardsWrap.innerHTML = `<div class="panel empty"><div class="serif">No team activity yet</div>Add a teammate above, then log tasks against a customer.</div>`;
  }
  ownersActive.filter(o=>o).forEach(owner=>{
    const mine = inRange.filter(t=>(t.owner||'Unassigned')===owner);
    const completed = mine.filter(t=>t.status==='Completed');
    const pendingAll = allTasks.filter(t=>(t.owner||'Unassigned')===owner && t.status!=='Completed');
    const time = mine.reduce((s,t)=>s+(Number(t.timeSpent)||0),0);
    const customers = Array.from(new Set(mine.map(t=>t.customerName)));
    const ownedCustomers = state.customers.filter(c=>(c.owner||'Unassigned')===owner);
    const revenueManaged = ownedCustomers.filter(c=>c.status!=='Churned').reduce((s,c)=>s+(Number(c.mrr)||0),0);
    const card = document.createElement('div');
    card.className='team-card';
    card.innerHTML = `
      <div class="team-card-head"><div class="team-card-name">${escapeHtml(owner)}</div><div class="panel-sub" style="margin:0;">${periodLabel}</div></div>
      <div class="team-card-stats">
        <div class="team-mini"><b>${completed.length}</b>completed</div>
        <div class="team-mini"><b>${pendingAll.length}</b>pending now</div>
        <div class="team-mini"><b>${fmtMinutes(time)}</b>logged</div>
        <div class="team-mini"><b>${customers.length}</b>customers touched</div>
        <div class="team-mini"><b>${ownedCustomers.length}</b>accounts owned</div>
        <div class="team-mini"><b>${money(revenueManaged)}</b>revenue managed</div>
      </div>
      ${mine.length? mine.slice(0,10).map(t=>`
        <div class="team-task-row" data-open="${t.customerId}">
          <span>${escapeHtml(t.customerName)} — ${escapeHtml(t.title)}</span>
          <span class="${pillClass(t.status)}">${t.status}</span>
        </div>`).join('') : `<div style="color:var(--ink-soft);font-size:12.5px;padding-top:6px;">No activity in this window.</div>`}
    `;
    card.querySelectorAll('[data-open]').forEach(r=>r.addEventListener('click', ()=>goToCustomer(r.dataset.open,'tasks')));
    cardsWrap.appendChild(card);
  });

  return wrap;
}

function renderAudit(){
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="topbar"><div><h1 class="page-title">Activity log</h1><div class="page-sub">Every create, edit, complete, and reassign — nothing disappears.</div></div></div>
  <div class="panel" id="audit-list"></div>`;
  const list = wrap.querySelector('#audit-list');
  const entries = state.auditLog.slice(0,150);
  if(entries.length===0){
    list.innerHTML = `<div class="empty"><div class="serif">No activity yet</div>Actions across the whole system will show up here.</div>`;
  } else {
    list.innerHTML = `<div class="panel-sub" style="margin-bottom:10px;">Showing the most recent ${entries.length} of ${state.auditLog.length}.</div>` +
      entries.map(e=>`
      <div class="audit-row">
        <div><strong>${escapeHtml(e.actor)}</strong> ${escapeHtml(e.action)}${e.customerId? ` — <span class="audit-link" data-open="${e.customerId}" data-tab="${e.detailTab||'overview'}">${escapeHtml(e.customerName)}</span>`:''}</div>
        <div class="audit-when">${fmtDateTime(e.ts)}</div>
      </div>`).join('');
    list.querySelectorAll('[data-open]').forEach(r=>r.addEventListener('click', ()=>goToCustomer(r.dataset.open, r.dataset.tab)));
  }
  return wrap;
}

function renderAddCustomerModal(){
  const back = document.createElement('div');
  back.className='modal-backdrop';
  back.addEventListener('click', e=>{ if(e.target===back){ state.showAddCustomer=false; render(); } });
  const modal = document.createElement('div');
  modal.className='modal';
  modal.innerHTML = `
    <h3>Add customer</h3>
    <div class="field-grid">
      <div class="field"><label>Company *</label><input id="ac-name" type="text"></div>
      <div class="field"><label>Contact person</label><input id="ac-contact" type="text"></div>
      <div class="field"><label>Email</label><input id="ac-email" type="text"></div>
      <div class="field"><label>Status</label><select id="ac-status">${STATUS_OPTIONS.map(o=>`<option ${o==='Trial'?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Owner</label><select id="ac-owner">${['Unassigned',...state.owners].map(o=>`<option ${o===state.actor?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Account manager</label><input id="ac-am" type="text"></div>
      <div class="field"><label>Billing cycle</label><select id="ac-cycle">${Object.keys(BILLING_CYCLES).map(o=>`<option>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Number of users</label><input id="ac-users" type="number" value="0"></div>
      <div class="field"><label>Deal value per cycle ($)</label><input id="ac-deal" type="number"></div>
      <div class="field"><label>Customer start date</label><input id="ac-start" type="date" value="${todayISO()}"></div>
      <div class="field"><label>Renewal date</label><input id="ac-renewal" type="date"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="ac-cancel">Cancel</button>
      <button class="btn btn-primary" id="ac-save">Add customer</button>
    </div>
  `;
  back.appendChild(modal);
  modal.querySelector('#ac-cancel').addEventListener('click', ()=>{ state.showAddCustomer=false; render(); });
  modal.querySelector('#ac-save').addEventListener('click', ()=>{
    const name = modal.querySelector('#ac-name').value.trim();
    if(!name){ modal.querySelector('#ac-name').style.borderColor='var(--red)'; return; }
    const owner = modal.querySelector('#ac-owner').value;
    const accountManager = modal.querySelector('#ac-am').value.trim();
    const nc = {
      id: uid(), name,
      contact: modal.querySelector('#ac-contact').value.trim(),
      email: modal.querySelector('#ac-email').value.trim(),
      phone:'', status: modal.querySelector('#ac-status').value,
      owner: owner==='Unassigned'?'':owner,
      accountManager: accountManager,
      billingCycle: modal.querySelector('#ac-cycle').value,
      dealValue: Number(modal.querySelector('#ac-deal').value)||0,
      numUsers: Number(modal.querySelector('#ac-users').value)||0,
      mrr: 0,
      renewalDate: modal.querySelector('#ac-renewal').value,
      lastContact:'', notes:[], tickets:[], tasks:[], featureUsage:[], mrrEvents:[], subscriptionCycles:[], payments:[], addons:[],
      createdAt: modal.querySelector('#ac-start').value || todayISO(),
    };
    recalcMrr(nc);
    if(nc.dealValue>0){
      nc.subscriptionCycles.push({
        id: uid(), numUsers: nc.numUsers, pricePerUser: nc.numUsers>0 ? Math.round((nc.dealValue/nc.numUsers)*100)/100 : 0,
        billingCycle: nc.billingCycle, subscriptionAmount: nc.dealValue, startDate: nc.createdAt, endDate:'',
        renewalDate: nc.renewalDate, status:'Active', note:'Initial cycle',
      });
    }
    state.customers.unshift(nc);
    persistCustomer(nc);
    logAudit(`${state.actor||'Someone'} created customer ${name}`, nc.id, nc.name, 'overview');
    state.showAddCustomer=false;
    state.view='detail'; state.activeId=nc.id; state.detailTab='overview';
    render();
    showToast('Customer added');
  });
  setTimeout(()=>modal.querySelector('#ac-name').focus(),0);
  return back;
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

async function boot(){
  const app = document.getElementById('app');
  app.innerHTML = '<div style="padding:60px;color:#5B6B62;">Loading…</div>';
  const restored = await restoreSession();
  if(restored){
    const profile = await fetchMyProfile().catch(()=>null);
    state.actor = profile ? profile.name : (session.user.email||'').split('@')[0];
    await loadAll();
    startLiveSync();
  } else {
    renderLogin();
  }
}
boot();
</script>
